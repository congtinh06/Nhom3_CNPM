
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1020" width="1440" height="1020" style="background:#ffffff; font-family:'Times New Roman', Times, serif;">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="genArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,1 10,6 0,11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="720" y="32" text-anchor="middle" font-size="18" font-weight="bold">HÌNH 3.1. SƠ ĐỒ CA SỬ DỤNG TỔNG THỂ HỆ THỐNG ECHORA (UML 2.5)</text>
  <text x="720" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">Phân bổ 43 Ca sử dụng vào 4 Phân hệ Nghiệp vụ và Tác nhân Tương tác</text>

  <!-- System Boundary -->
  <rect x="230" y="70" width="970" height="925" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="230" y="70" width="450" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="240" y="88" font-size="13" font-weight="bold">System Boundary: Nền tảng Du lịch Số Echora</text>

  <!-- Left: Human Actors -->
  
    <g transform="translate(60, 150)">
      <circle cx="20" cy="15" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="27" x2="20" y2="58" stroke="#000000" stroke-width="1.8"/>
      <line x1="0" y1="38" x2="40" y2="38" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="5" y2="85" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="35" y2="85" stroke="#000000" stroke-width="1.8"/>
      <text x="20" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Khách vãng lai</text>
      <text x="20" y="120" text-anchor="middle" font-size="10" fill="#444444">(Guest)</text>
    </g>
  
  
    <g transform="translate(60, 420)">
      <circle cx="20" cy="15" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="27" x2="20" y2="58" stroke="#000000" stroke-width="1.8"/>
      <line x1="0" y1="38" x2="40" y2="38" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="5" y2="85" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="35" y2="85" stroke="#000000" stroke-width="1.8"/>
      <text x="20" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Người dùng đăng ký</text>
      <text x="20" y="120" text-anchor="middle" font-size="10" fill="#444444">(Registered User)</text>
    </g>
  
  
    <g transform="translate(60, 750)">
      <circle cx="20" cy="15" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="27" x2="20" y2="58" stroke="#000000" stroke-width="1.8"/>
      <line x1="0" y1="38" x2="40" y2="38" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="5" y2="85" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="35" y2="85" stroke="#000000" stroke-width="1.8"/>
      <text x="20" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Quản trị viên</text>
      <text x="20" y="120" text-anchor="middle" font-size="10" fill="#444444">(Administrator)</text>
    </g>
  

  <!-- Generalization: Registered User -> Guest -->
  <line x1="80" y1="410" x2="80" y2="280" stroke="#000000" stroke-width="1.5" marker-end="url(#genArrow)"/>

  <!-- Right: External Actors -->
  
    <g transform="translate(1230, 130)">
      <rect x="0" y="0" width="180" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;External Sensor&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Thiết bị GPS</text>
    </g>
  
  
    <g transform="translate(1230, 260)">
      <rect x="0" y="0" width="180" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;Payment Gateway&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">VNPAY / VietQR</text>
    </g>
  
  
    <g transform="translate(1230, 680)">
      <rect x="0" y="0" width="180" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;External AI Service&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">MyMemory / Edge-TTS</text>
    </g>
  
  
    <g transform="translate(1230, 850)">
      <rect x="0" y="0" width="180" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;Message Broker&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">RabbitMQ Broker</text>
    </g>
  

  <!-- ================= SUB-SYSTEM 1: DU KHÁCH (TOP) ================= -->
  <rect x="250" y="105" width="930" height="235" fill="#fafafa" stroke="#666666" stroke-dasharray="3 3"/>
  <text x="260" y="123" font-size="11" font-weight="bold" fill="#333333">[Phân hệ 1: Du khách &amp; Trải nghiệm Di sản]</text>

  
    <g>
      <ellipse cx="400" cy="160" rx="110" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="400" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-01: Khám phá bản đồ di tích</text>
      
    </g>
  
  
    <g>
      <ellipse cx="670" cy="160" rx="115" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="670" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-02: Nghe thuyết minh đa ngữ</text>
      
    </g>
  
  
    <g>
      <ellipse cx="950" cy="160" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="950" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-03: Nhận thuyết minh GPS tự động</text>
      
    </g>
  
  
    <g>
      <ellipse cx="670" cy="230" rx="105" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="670" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-04: Quét mã QR di sản</text>
      
    </g>
  
  
    <g>
      <ellipse cx="400" cy="230" rx="110" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="400" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-05: Chế độ giả lập tọa độ</text>
      
    </g>
  
  
    <g>
      <ellipse cx="400" cy="300" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="400" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-06/07: Duyệt &amp; Xem quà lưu niệm</text>
      
    </g>
  
  
    <g>
      <ellipse cx="670" cy="300" rx="115" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="670" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-08/09: Xem tin tức &amp; Bài viết di sản</text>
      
    </g>
  

  <!-- ================= SUB-SYSTEM 2: NGƯỜI DÙNG &amp; GIAO DỊCH (MIDDLE) ================= -->
  <rect x="250" y="355" width="930" height="240" fill="#fafafa" stroke="#666666" stroke-dasharray="3 3"/>
  <text x="260" y="373" font-size="11" font-weight="bold" fill="#333333">[Phân hệ 2: Người dùng, Giỏ hàng &amp; Thanh toán]</text>

  
    <g>
      <ellipse cx="420" cy="410" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="420" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-10..14: Đăng ký / Đăng nhập / Google</text>
      
    </g>
  
  
    <g>
      <ellipse cx="700" cy="410" rx="115" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="700" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-15: Đăng nhập quét mã QR</text>
      
    </g>
  
  
    <g>
      <ellipse cx="420" cy="480" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="420" y="484" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-18: Quản lý giỏ hàng quà</text>
      
    </g>
  
  
    <g>
      <ellipse cx="700" cy="480" rx="115" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="700" y="484" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-19: Đặt hàng quà lưu niệm</text>
      
    </g>
  
  
    <g>
      <ellipse cx="420" cy="550" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="420" y="554" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-20: Mua gói ngoại ngữ Premium</text>
      
    </g>
  
  
    <g>
      <ellipse cx="700" cy="550" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="700" y="554" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-21/22: Thanh toán VNPAY / VietQR</text>
      
    </g>
  
  
    <g>
      <ellipse cx="980" cy="480" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="980" y="484" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-23/24: Hủy đơn &amp; Lịch sử đơn hàng</text>
      
    </g>
  

  <!-- ================= SUB-SYSTEM 3: QUẢN TRỊ &amp; NỀN (BOTTOM) ================= -->
  <rect x="250" y="610" width="930" height="370" fill="#fafafa" stroke="#666666" stroke-dasharray="3 3"/>
  <text x="260" y="628" font-size="11" font-weight="bold" fill="#333333">[Phân hệ 3 &amp; 4: Quản trị CMS &amp; Tự động hóa Dịch vụ Nền AI]</text>

  
    <g>
      <ellipse cx="420" cy="660" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="420" y="664" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-25/26: Đăng nhập &amp; Tổng quan CMS</text>
      
    </g>
  
  
    <g>
      <ellipse cx="420" cy="725" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="420" y="729" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-27..29: Quản lý điểm di tích (POI)</text>
      
    </g>
  
  
    <g>
      <ellipse cx="700" cy="660" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="700" y="664" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-30/32: Quản lý bản dịch &amp; Sửa lỗi</text>
      
    </g>
  
  
    <g>
      <ellipse cx="700" cy="725" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="700" y="729" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-31: Quản lý mã QR di sản</text>
      
    </g>
  
  
    <g>
      <ellipse cx="420" cy="790" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="420" y="794" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-33/34/35: Quản lý Khu vực &amp; Lộ trình</text>
      
    </g>
  
  
    <g>
      <ellipse cx="700" cy="790" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="700" y="794" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-36/37: Quản lý Quà lưu niệm &amp; Tin tức</text>
      
    </g>
  
  
    <g>
      <ellipse cx="420" cy="855" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="420" y="859" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-38: Quản lý tài khoản &amp; Quyền</text>
      
    </g>
  
  
    <g>
      <ellipse cx="700" cy="855" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="700" y="859" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-39: Xử lý đơn &amp; Giao hàng</text>
      
    </g>
  
  
    <g>
      <ellipse cx="700" cy="920" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="700" y="924" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-40: Báo cáo thống kê du lịch</text>
      
    </g>
  

  
    <g>
      <ellipse cx="990" cy="680" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="990" y="684" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-41: Tự động dịch thuật AI (MyMemory)</text>
      
    </g>
  
  
    <g>
      <ellipse cx="990" cy="745" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="990" y="749" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-42: Tự động sinh audio (Edge-TTS)</text>
      
    </g>
  
  
    <g>
      <ellipse cx="990" cy="855" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="990" y="859" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-43: Thu thập sự kiện du lịch</text>
      
    </g>
  

  <!-- Actor Associations -->
  <!-- Guest to Subsystem 1 -->
  <line x1="100" y1="180" x2="290" y2="160" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="180" x2="555" y2="160" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="180" x2="290" y2="230" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="180" x2="280" y2="300" stroke="#000000" stroke-width="1.2"/>

  <!-- Registered User to Subsystem 2 -->
  <line x1="100" y1="460" x2="300" y2="410" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="460" x2="300" y2="480" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="460" x2="300" y2="550" stroke="#000000" stroke-width="1.2"/>

  <!-- Admin to Subsystem 3 -->
  <line x1="100" y1="780" x2="300" y2="660" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="780" x2="300" y2="725" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="780" x2="300" y2="790" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="780" x2="300" y2="855" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="780" x2="580" y2="855" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="780" x2="580" y2="920" stroke="#000000" stroke-width="1.2"/>

  <!-- External Actor Associations -->
  <line x1="1230" y1="150" x2="1075" y2="160" stroke="#000000" stroke-width="1.2"/>
  <line x1="1230" y1="280" x2="825" y2="550" stroke="#000000" stroke-width="1.2"/>
  <line x1="1230" y1="700" x2="1115" y2="680" stroke="#000000" stroke-width="1.2"/>
  <line x1="1230" y1="700" x2="1115" y2="745" stroke="#000000" stroke-width="1.2"/>
  <line x1="1230" y1="870" x2="1115" y2="855" stroke="#000000" stroke-width="1.2"/>

  <!-- Includes &amp; Extends -->
  <!-- UC-03 includes UC-02 -->
  <line x1="825" y1="160" x2="785" y2="160" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="805" y="152" text-anchor="middle" font-size="9" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-04 includes UC-02 -->
  <line x1="670" y1="208" x2="670" y2="182" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="635" y="198" text-anchor="middle" font-size="9" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-19 includes UC-21/22 -->
  <line x1="700" y1="502" x2="700" y2="528" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="665" y="518" text-anchor="middle" font-size="9" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-20 includes UC-21/22 -->
  <line x1="540" y1="550" x2="575" y2="550" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="557" y="542" text-anchor="middle" font-size="9" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-28..29 triggers UC-41 &amp; UC-42 -->
  <line x1="540" y1="725" x2="865" y2="685" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="680" y="700" text-anchor="middle" font-size="9" font-style="italic">&lt;&lt;include / async event&gt;&gt;</text>

  <!-- UC-03/04 triggers UC-43 -->
  <line x1="950" y1="182" x2="990" y2="833" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="945" y="450" text-anchor="middle" font-size="9" font-style="italic">&lt;&lt;include / event&gt;&gt;</text>
</svg>
