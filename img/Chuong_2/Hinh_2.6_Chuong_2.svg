  <text x="600" y="32" text-anchor="middle" font-size="17" font-weight="bold">HÌNH 2.6. SƠ ĐỒ CẤU TRÚC PHÂN RÃ PRODUCT BACKLOG (EPIC - FEATURE - USER STORY - AC)</text>
