  <text class="small" x="778" y="379">event</text>
  <text class="small" x="764" y="454">audio progress / ready / failed</text>
  <text class="small" x="330" y="454">trạng thái audio</text>

  <rect x="24" y="520" width="1152" height="106" rx="12" fill="#fff" stroke="#d7e1e5"/>
