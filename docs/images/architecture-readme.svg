  <rect width="1200" height="650" fill="#f7fafb"/>
  <text class="title" x="36" y="48">Echora · Kiến trúc hệ thống</text>

  <rect x="24" y="70" width="1152" height="204" rx="12" fill="#fff" stroke="#d7e1e5"/>
  <text class="section" x="44" y="99">1 · YÊU CẦU REST</text>
  <rect class="card" x="55" y="139" width="190" height="82" rx="8"/>
  <use href="#icon-react" x="76" y="167" width="26" height="26" class="accent"/>
  <text class="label" x="114" y="174">Web app</text><text class="small" x="114" y="196">React · GPS · QR</text>
  <rect class="card" x="365" y="139" width="190" height="82" rx="8"/>
  <use href="#icon-spring" x="386" y="167" width="26" height="26" class="accent"/>
  <text class="label" x="424" y="174">API Gateway</text><text class="small" x="424" y="196">REST routes</text>
  <rect class="card" x="690" y="139" width="210" height="82" rx="8"/>
  <use href="#icon-spring" x="711" y="167" width="26" height="26" class="accent"/>
  <text class="label" x="749" y="174">location-service</text><text class="small" x="749" y="196">GPS / QR lookup</text>
  <rect class="card" x="965" y="139" width="190" height="82" rx="8"/>
  <use href="#icon-spring" x="983" y="167" width="26" height="26" class="accent"/>
  <text class="label" x="1020" y="174">content-service</text><text class="small" x="1020" y="196">POI content</text>
  <path class="arrow" d="M245 180H365"/><path class="arrow" d="M555 180H690"/><path class="arrow" d="M900 180H965"/>
  <text class="small" x="284" y="164">HTTP</text><text class="small" x="601" y="164">REST</text><text class="small" x="918" y="164">REST</text>

  <rect x="24" y="294" width="1152" height="206" rx="12" fill="#fff" stroke="#d7e1e5"/>
  <text class="section" x="44" y="323">2 · SỰ KIỆN THUYẾT MINH</text>
  <rect class="card" x="72" y="359" width="242" height="100" rx="8"/>
  <use href="#icon-spring" x="92" y="396" width="26" height="26" class="accent"/>
  <text class="label" x="130" y="400">content-service</text><text class="small" x="130" y="424">phát POI events</text>
  <rect class="card" x="475" y="359" width="250" height="100" rx="8"/>
  <use href="#icon-rabbitmq" x="495" y="396" width="26" height="26" class="accent"/>
  <text class="label" x="533" y="400">RabbitMQ</text><text class="small" x="533" y="424">echora.topic</text>
  <rect class="card" x="886" y="359" width="242" height="100" rx="8"/>
  <use href="#icon-spring" x="906" y="396" width="26" height="26" class="accent"/>
