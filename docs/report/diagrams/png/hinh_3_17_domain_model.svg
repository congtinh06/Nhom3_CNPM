<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" style="background:#ffffff; font-family:'Times New Roman', Times, serif;">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="genArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,1 10,6 0,11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="diamond" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,6 5,2 10,6 5,10" fill="#000000" stroke="#000000" stroke-width="1"/>
    </marker>
    <marker id="openDiamond" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,6 5,2 10,6 5,10" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    </marker>
  </defs>

  <text x="600" y="32" text-anchor="middle" font-size="17" font-weight="bold">HÌNH 3.17. SƠ ĐỒ LỚP MIỀN KHÁI NIỆM HỆ THỐNG ECHORA (CONCEPTUAL DOMAIN MODEL)</text>
  <text x="600" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">Các Thực thể Nghiệp vụ Cốt lõi, Thuộc tính Chính và Mối quan hệ Liên kết Số lượng</text>

  <!-- Class User -->
  <rect x="50" y="90" width="220" height="155" fill="#fafafa" stroke="#000000" stroke-width="1.5"/>
  <rect x="50" y="90" width="220" height="25" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="160" y="107" text-anchor="middle" font-size="12" font-weight="bold">User</text>
  <text x="60" y="130" font-size="10">+ Long id</text>
  <text x="60" y="146" font-size="10">+ String email</text>
  <text x="60" y="162" font-size="10">+ String fullName</text>
  <text x="60" y="178" font-size="10">+ String role [USER, ADMIN]</text>
  <text x="60" y="194" font-size="10">+ String plan [FREE, PREMIUM]</text>
  <text x="60" y="210" font-size="10">+ DateTime premiumExpiresAt</text>
  <text x="60" y="226" font-size="10">+ String status [ACTIVE, LOCKED]</text>

  <!-- Class Order -->
  <rect x="360" y="90" width="250" height="185" fill="#fafafa" stroke="#000000" stroke-width="1.5"/>
  <rect x="360" y="90" width="250" height="25" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="485" y="107" text-anchor="middle" font-size="12" font-weight="bold">Order</text>
  <text x="370" y="130" font-size="10">+ Long id</text>
  <text x="370" y="146" font-size="10">+ String orderCode</text>
  <text x="370" y="162" font-size="10">+ Long userId</text>
  <text x="370" y="178" font-size="10">+ BigDecimal totalAmount</text>
  <text x="370" y="194" font-size="10">+ BigDecimal shippingFee</text>
  <text x="370" y="210" font-size="10">+ OrderStatus status</text>
  <text x="370" y="226" font-size="10">+ PaymentMethod paymentMethod</text>
  <text x="370" y="242" font-size="10">+ PaymentStatus paymentStatus</text>
  <text x="370" y="258" font-size="10">+ DateTime expiresAt (15m)</text>

  <!-- Class OrderItem -->
  <rect x="700" y="90" width="200" height="150" fill="#fafafa" stroke="#000000" stroke-width="1.5"/>
  <rect x="700" y="90" width="200" height="25" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="800" y="107" text-anchor="middle" font-size="12" font-weight="bold">OrderItem</text>
  <text x="710" y="130" font-size="10">+ Long id</text>
  <text x="710" y="146" font-size="10">+ Long orderId</text>
  <text x="710" y="162" font-size="10">+ Long productId</text>
  <text x="710" y="178" font-size="10">+ String productTitle</text>
  <text x="710" y="194" font-size="10">+ BigDecimal unitPrice</text>
  <text x="710" y="210" font-size="10">+ Integer quantity</text>
  <text x="710" y="226" font-size="10">+ BigDecimal totalPrice</text>

  <!-- Class Product -->
  <rect x="970" y="90" width="190" height="175" fill="#fafafa" stroke="#000000" stroke-width="1.5"/>
  <rect x="970" y="90" width="190" height="25" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="1065" y="107" text-anchor="middle" font-size="12" font-weight="bold">Product (Quà lưu niệm)</text>
  <text x="980" y="130" font-size="10">+ Long id</text>
  <text x="980" y="146" font-size="10">+ String slug</text>
  <text x="980" y="162" font-size="10">+ String title</text>
  <text x="980" y="178" font-size="10">+ BigDecimal price</text>
  <text x="980" y="194" font-size="10">+ String imageUrl</text>
  <text x="980" y="210" font-size="10">+ String category</text>
  <text x="980" y="226" font-size="10">+ Long poiId (Liên kết di tích)</text>
  <text x="980" y="242" font-size="10">+ String status [ACTIVE]</text>

  <!-- Class Payment -->
  <rect x="360" y="340" width="250" height="145" fill="#fafafa" stroke="#000000" stroke-width="1.5"/>
  <rect x="360" y="340" width="250" height="25" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="485" y="357" text-anchor="middle" font-size="12" font-weight="bold">Payment (Giao dịch)</text>
  <text x="370" y="380" font-size="10">+ Long id</text>
  <text x="370" y="396" font-size="10">+ Long orderId</text>
  <text x="370" y="412" font-size="10">+ String transactionId</text>
  <text x="370" y="428" font-size="10">+ BigDecimal amount</text>
  <text x="370" y="444" font-size="10">+ String paymentMethod [VNPAY/CASH]</text>
  <text x="370" y="460" font-size="10">+ String status [SUCCESS/FAILED]</text>
  <text x="370" y="476" font-size="10">+ DateTime paidAt</text>

  <!-- Class Zone -->
  <rect x="50" y="550" width="220" height="140" fill="#fafafa" stroke="#000000" stroke-width="1.5"/>
  <rect x="50" y="550" width="220" height="25" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="160" y="567" text-anchor="middle" font-size="12" font-weight="bold">Zone (Khu vực di sản)</text>
  <text x="60" y="590" font-size="10">+ Long id</text>
  <text x="60" y="606" font-size="10">+ String name</text>
  <text x="60" y="622" font-size="10">+ String description</text>
  <text x="60" y="638" font-size="10">+ Double latitude</text>
  <text x="60" y="654" font-size="10">+ Double longitude</text>
  <text x="60" y="670" font-size="10">+ Long version (@Version)</text>

  <!-- Class POI -->
  <rect x="360" y="550" width="250" height="170" fill="#fafafa" stroke="#000000" stroke-width="1.5"/>
  <rect x="360" y="550" width="250" height="25" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="485" y="567" text-anchor="middle" font-size="12" font-weight="bold">Poi (Điểm di tích văn hóa)</text>
  <text x="370" y="590" font-size="10">+ Long id</text>
  <text x="370" y="606" font-size="10">+ String slug</text>
  <text x="370" y="622" font-size="10">+ String name</text>
  <text x="370" y="638" font-size="10">+ Double latitude</text>
  <text x="370" y="654" font-size="10">+ Double longitude</text>
  <text x="370" y="670" font-size="10">+ Integer geofenceRadius (35-60m)</text>
  <text x="370" y="686" font-size="10">+ Long zoneId</text>
  <text x="370" y="702" font-size="10">+ Long version (@Version)</text>

  <!-- Class PoiTranslation -->
  <rect x="700" y="550" width="220" height="185" fill="#fafafa" stroke="#000000" stroke-width="1.5"/>
  <rect x="700" y="550" width="220" height="25" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="810" y="567" text-anchor="middle" font-size="12" font-weight="bold">PoiTranslation (Bản dịch)</text>
  <text x="710" y="590" font-size="10">+ Long id</text>
  <text x="710" y="606" font-size="10">+ Long poiId</text>
  <text x="710" y="622" font-size="10">+ String languageCode [vi,en,ja,ko]</text>
  <text x="710" y="638" font-size="10">+ String title</text>
  <text x="710" y="654" font-size="10">+ String summary</text>
  <text x="710" y="670" font-size="10">+ String descriptionAudioText</text>
  <text x="710" y="686" font-size="10">+ String audioUrl (MP3 volume)</text>
  <text x="710" y="702" font-size="10">+ String audioStatus [READY]</text>
  <text x="710" y="718" font-size="10">+ String translationSource [AUTO,MANUAL]</text>

  <!-- Class Route -->
  <rect x="50" y="730" width="220" height="105" fill="#fafafa" stroke="#000000" stroke-width="1.5"/>
  <rect x="50" y="730" width="220" height="25" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="160" y="747" text-anchor="middle" font-size="12" font-weight="bold">Route (Lộ trình Tour)</text>
  <text x="60" y="770" font-size="10">+ Long id</text>
  <text x="60" y="786" font-size="10">+ String name</text>
  <text x="60" y="802" font-size="10">+ Integer estimatedDuration</text>
  <text x="60" y="818" font-size="10">+ Long zoneId</text>

  <!-- Class RouteStop -->
  <rect x="360" y="750" width="250" height="95" fill="#fafafa" stroke="#000000" stroke-width="1.5"/>
  <rect x="360" y="750" width="250" height="25" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="485" y="767" text-anchor="middle" font-size="12" font-weight="bold">RouteStop (Trạm dừng)</text>
  <text x="370" y="790" font-size="10">+ Long id, Long routeId, Long poiId</text>
  <text x="370" y="806" font-size="10">+ Integer stopOrder (Thứ tự tham quan)</text>
  <text x="370" y="822" font-size="10">+ Integer durationMinutes</text>

  <!-- Relationships -->
  <!-- User 1 -- 0..* Order -->
  <line x1="270" y1="160" x2="360" y2="160" stroke="#000000" stroke-width="1.3"/>
  <text x="280" y="152" font-size="10">1</text>
  <text x="340" y="152" font-size="10">0..*</text>
  <text x="315" y="175" text-anchor="middle" font-size="9">đặt &gt;</text>

  <!-- Order 1 *-- 1..* OrderItem -->
  <line x1="610" y1="160" x2="700" y2="160" stroke="#000000" stroke-width="1.3" marker-start="url(#diamond)"/>
  <text x="625" y="152" font-size="10">1</text>
  <text x="680" y="152" font-size="10">1..*</text>
  <text x="655" y="175" text-anchor="middle" font-size="9">gồm &gt;</text>

  <!-- OrderItem 0..* -- 1 Product -->
  <line x1="900" y1="160" x2="970" y2="160" stroke="#000000" stroke-width="1.3"/>
  <text x="910" y="152" font-size="10">0..*</text>
  <text x="955" y="152" font-size="10">1</text>
  <text x="935" y="175" text-anchor="middle" font-size="9">&lt; thuộc</text>

  <!-- Order 1 -- 0..* Payment -->
  <line x1="485" y1="275" x2="485" y2="340" stroke="#000000" stroke-width="1.3"/>
  <text x="492" y="290" font-size="10">1</text>
  <text x="492" y="330" font-size="10">0..*</text>

  <!-- Zone 1 -- 0..* Poi -->
  <line x1="270" y1="620" x2="360" y2="620" stroke="#000000" stroke-width="1.3"/>
  <text x="280" y="612" font-size="10">1</text>
  <text x="340" y="612" font-size="10">0..*</text>
  <text x="315" y="635" text-anchor="middle" font-size="9">chứa &gt;</text>

  <!-- Poi 1 *-- 1..* PoiTranslation -->
  <line x1="610" y1="620" x2="700" y2="620" stroke="#000000" stroke-width="1.3" marker-start="url(#diamond)"/>
  <text x="625" y="612" font-size="10">1</text>
  <text x="680" y="612" font-size="10">1..*</text>
  <text x="655" y="635" text-anchor="middle" font-size="9">đa ngữ &gt;</text>

  <!-- Poi 1 -- 0..* Product -->
  <path d="M 610 570 Q 1065 570, 1065 265" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="850" y="562" text-anchor="middle" font-size="9">liên kết quà lưu niệm</text>

  <!-- Zone 1 -- 0..* Route -->
  <line x1="160" y1="690" x2="160" y2="730" stroke="#000000" stroke-width="1.3"/>
  <text x="168" y="705" font-size="10">1</text>
  <text x="168" y="725" font-size="10">0..*</text>

  <!-- Route 1 *-- 1..* RouteStop -->
  <line x1="270" y1="785" x2="360" y2="785" stroke="#000000" stroke-width="1.3" marker-start="url(#diamond)"/>
  <text x="285" y="777" font-size="10">1</text>
  <text x="340" y="777" font-size="10">1..*</text>
  <text x="315" y="800" text-anchor="middle" font-size="9">gồm trạm</text>

  <!-- RouteStop 0..* -- 1 Poi -->
  <line x1="485" y1="750" x2="485" y2="720" stroke="#000000" stroke-width="1.3"/>
  <text x="492" y="742" font-size="10">0..*</text>
  <text x="492" y="730" font-size="10">1</text>
</svg>