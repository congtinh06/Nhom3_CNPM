
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#ffffff; font-family:'Times New Roman', Times, serif;">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="genArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,1 10,6 0,11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="32" text-anchor="middle" font-size="17" font-weight="bold">HÌNH 3.6. SƠ ĐỒ CA SỬ DỤNG PHÂN HỆ TỰ ĐỘNG HÓA DỊCH VỤ NỀN &amp; AI PIPELINE</text>
  <text x="600" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">Quy trình Xử lý Bất đồng bộ qua RabbitMQ: Dịch thuật, Tổng hợp Âm thanh Edge-TTS &amp; Phân tích Sự kiện</text>

  <!-- System Boundary -->
  <rect x="260" y="80" width="680" height="560" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="260" y="80" width="460" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="270" y="98" font-size="13" font-weight="bold">Phân hệ Tự động hóa &amp; Dịch vụ Xử lý Nền (Background Workers)</text>

  <!-- Left: Triggering Services / Events -->
  
    <g transform="translate(40, 160)">
      <rect x="0" y="0" width="180" height="55" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;Service Publisher&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Content Service (PoiEventPublisher)</text>
    </g>
  
  
    <g transform="translate(40, 420)">
      <rect x="0" y="0" width="180" height="55" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;Service Publisher&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Gateway / Frontend (Analytics Event)</text>
    </g>
  

  <!-- Right: External Services -->
  
    <g transform="translate(980, 160)">
      <rect x="0" y="0" width="180" height="50" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;External Translation&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">MyMemory Translation API</text>
    </g>
  
  
    <g transform="translate(980, 270)">
      <rect x="0" y="0" width="180" height="50" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;External AI TTS&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Microsoft Edge-TTS CLI</text>
    </g>
  
  
    <g transform="translate(980, 380)">
      <rect x="0" y="0" width="180" height="50" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;Local Volume&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Audio Storage Volume</text>
    </g>
  
  
    <g transform="translate(980, 490)">
      <rect x="0" y="0" width="180" height="50" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;Database System&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">echora_analytics_db</text>
    </g>
  

  <!-- Use Cases -->
  
    <g>
      <ellipse cx="600" cy="180" rx="160" ry="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="600" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-41: Tự động dịch thuật nội dung POI</text>
      <text x="600" y="192" text-anchor="middle" font-size="9.5" fill="#444444">RabbitMQ -&gt; Dịch en,ja,ko (Bảo toàn MANUAL)</text>
    </g>
  
  
    <g>
      <ellipse cx="600" cy="320" rx="160" ry="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="600" y="317" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-42: Tự động tổng hợp âm thanh AI</text>
      <text x="600" y="332" text-anchor="middle" font-size="9.5" fill="#444444">Edge-TTS -&gt; Sinh MP3 -&gt; PoiAudioReadyEvent</text>
    </g>
  
  
    <g>
      <ellipse cx="600" cy="480" rx="160" ry="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="600" y="477" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-43: Thu thập sự kiện phân tích du lịch</text>
      <text x="600" y="492" text-anchor="middle" font-size="9.5" fill="#444444">Event SCAN / PLAY -&gt; Lưu Analytics Event</text>
    </g>
  

  <!-- Flow Associations -->
  <line x1="220" y1="187" x2="440" y2="180" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="175" text-anchor="middle" font-size="9.5" font-weight="bold">poi.updated (AMQP)</text>

  <line x1="600" y1="210" x2="600" y2="290" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="655" y="255" text-anchor="middle" font-size="9.5" font-style="italic">&lt;&lt;include / pipeline&gt;&gt;</text>

  <line x1="760" y1="180" x2="980" y2="185" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="870" y="172" text-anchor="middle" font-size="9">REST JSON / Seed</text>

  <line x1="760" y1="320" x2="980" y2="295" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="870" y="295" text-anchor="middle" font-size="9">CLI Process</text>

  <line x1="760" y1="335" x2="980" y2="400" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="870" y="380" text-anchor="middle" font-size="9">Ghi tệp MP3</text>

  <line x1="220" y1="447" x2="440" y2="480" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="450" text-anchor="middle" font-size="9.5" font-weight="bold">POST /events (JSON)</text>

  <line x1="760" y1="480" x2="980" y2="510" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="870" y="485" text-anchor="middle" font-size="9">Ghi bản ghi CSDL</text>
</svg>
