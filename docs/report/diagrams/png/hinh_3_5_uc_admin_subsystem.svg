      <text x="780" y="372" text-anchor="middle" font-size="9.5" fill="#444444">Soạn thảo bài viết di sản</text>
    </g>
  
  
    <g>
      <ellipse cx="780" cy="430" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="780" y="427" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-37B: Sửa &amp; Xóa bài viết tin tức</text>
      <text x="780" y="442" text-anchor="middle" font-size="9.5" fill="#444444">Chuyển DRAFT / PUBLISHED</text>
    </g>
  
  
    <g>
      <ellipse cx="780" cy="520" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="780" y="517" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-38A: Quản lý tài khoản người dùng</text>
      <text x="780" y="532" text-anchor="middle" font-size="9.5" fill="#444444">Danh sách, Khóa/Mở tài khoản</text>
    </g>
  
  
    <g>
      <ellipse cx="780" cy="590" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="780" y="587" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-38B: Phân quyền vai trò người dùng</text>
      <text x="780" y="602" text-anchor="middle" font-size="9.5" fill="#444444">Gán quyền USER / ADMIN</text>
    </g>
  
  
    <g>
      <ellipse cx="780" cy="680" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="780" y="677" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-39A: Quản lý danh sách đơn hàng</text>
      <text x="780" y="692" text-anchor="middle" font-size="9.5" fill="#444444">Lọc đơn PENDING, PAID, DELIVERED</text>
    </g>
  
  
    <g>
      <ellipse cx="780" cy="750" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="780" y="747" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-39B: Xác nhận thanh toán &amp; Giao hàng</text>
      <text x="780" y="762" text-anchor="middle" font-size="9.5" fill="#444444">Xác nhận VietQR, Chuyển DELIVERED</text>
    </g>
  
  
    <g>
      <ellipse cx="780" cy="840" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="780" y="837" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-40: Báo cáo thống kê lượt tương tác</text>
      <text x="780" y="852" text-anchor="middle" font-size="9.5" fill="#444444">Thống kê QR scan, Tỷ lệ nghe audio</text>
    </g>
  

