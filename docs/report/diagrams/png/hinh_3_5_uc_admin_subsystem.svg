
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 950" width="1280" height="950" style="background:#ffffff; font-family:'Times New Roman', Times, serif;">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="genArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,1 10,6 0,11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="32" text-anchor="middle" font-size="17" font-weight="bold">HÌNH 3.5. SƠ ĐỒ CA SỬ DỤNG PHÂN HỆ QUẢN TRỊ NỘI DUNG DI SẢN &amp; CMS</text>
  <text x="640" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">Các Chức năng Độc lập dành riêng cho Quản trị viên Di sản (Administrator)</text>

  <!-- System Boundary -->
  <rect x="260" y="75" width="760" height="850" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="260" y="75" width="460" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="270" y="93" font-size="13" font-weight="bold">Phân hệ Quản trị Di sản (Admin Console /quan-tri)</text>

  <!-- Actors -->
  
    <g transform="translate(70, 430)">
      <circle cx="20" cy="15" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="27" x2="20" y2="58" stroke="#000000" stroke-width="1.8"/>
      <line x1="0" y1="38" x2="40" y2="38" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="5" y2="85" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="35" y2="85" stroke="#000000" stroke-width="1.8"/>
      <text x="20" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Quản trị viên</text>
      <text x="20" y="120" text-anchor="middle" font-size="10" fill="#444444">(Administrator)</text>
    </g>
  
  
    <g transform="translate(1070, 240)">
      <rect x="0" y="0" width="180" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;External Storage&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Storage Volume (Ảnh/Audio)</text>
    </g>
  
  
    <g transform="translate(1070, 600)">
      <rect x="0" y="0" width="180" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;Message Broker&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">RabbitMQ Exchange</text>
    </g>
  

  <!-- Column 1 Use Cases -->
  
    <g>
      <ellipse cx="460" cy="140" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="137" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-25: Đăng nhập cổng quản trị</text>
      <text x="460" y="152" text-anchor="middle" font-size="9.5" fill="#444444">/quan-tri/dang-nhap</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="210" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-26: Xem bảng điều khiển tổng quan</text>
      <text x="460" y="222" text-anchor="middle" font-size="9.5" fill="#444444">KPI POI, Doanh thu, User</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="280" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-27: Xem danh mục điểm di tích (POI)</text>
      <text x="460" y="292" text-anchor="middle" font-size="9.5" fill="#444444">Bảng danh sách, Lọc khu vực</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="350" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="347" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-28: Thêm mới điểm tham quan (POI)</text>
      <text x="460" y="362" text-anchor="middle" font-size="9.5" fill="#444444">Tọa độ, Bán kính, Thuyết minh vi</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="420" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="417" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-29: Cập nhật điểm tham quan (POI)</text>
      <text x="460" y="432" text-anchor="middle" font-size="9.5" fill="#444444">Khóa lạc quan @Version, Publish</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="490" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="487" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-30: Quản lý bản dịch đa ngữ POI</text>
      <text x="460" y="502" text-anchor="middle" font-size="9.5" fill="#444444">Duyệt 4 ngữ, Nguồn AUTO/MANUAL</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="560" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="557" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-31: Quản lý và xuất mã QR POI</text>
      <text x="460" y="572" text-anchor="middle" font-size="9.5" fill="#444444">Tải mã QR in ấn biển chỉ dẫn</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="630" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="627" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-32: Theo dõi lỗi dịch &amp; Kích hoạt lại</text>
      <text x="460" y="642" text-anchor="middle" font-size="9.5" fill="#444444">PoiErrorLog, Republish audio</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="700" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="697" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-33: Quản lý khu vực di tích (Zone)</text>
      <text x="460" y="712" text-anchor="middle" font-size="9.5" fill="#444444">Danh sách, Thêm, Sửa khu vực</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="770" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="767" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-34: Quản lý lộ trình tour (Route)</text>
      <text x="460" y="782" text-anchor="middle" font-size="9.5" fill="#444444">Danh sách, Thêm, Sửa lộ trình</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="840" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="837" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-35: Sắp xếp trạm dừng lộ trình</text>
      <text x="460" y="852" text-anchor="middle" font-size="9.5" fill="#444444">Route Stops, Thứ tự tham quan</text>
    </g>
  

  <!-- Column 2 Use Cases -->
  
    <g>
      <ellipse cx="780" cy="210" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="780" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-36A: Xem danh sách quà lưu niệm</text>
      <text x="780" y="222" text-anchor="middle" font-size="9.5" fill="#444444">Giá bán, Tồn kho, Trạng thái</text>
    </g>
  
  
    <g>
      <ellipse cx="780" cy="280" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="780" y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-36B: Thêm &amp; Cập nhật quà lưu niệm</text>
      <text x="780" y="292" text-anchor="middle" font-size="9.5" fill="#444444">Upload ảnh, Sort order</text>
    </g>
  
  
    <g>
      <ellipse cx="780" cy="360" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
