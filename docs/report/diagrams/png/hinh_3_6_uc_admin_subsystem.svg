      <text x="460" y="640" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Theo dõi lỗi dịch &amp; Kích hoạt lại</text>
      <text x="460" y="652" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">PoiErrorLog, Republish audio</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="700" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
