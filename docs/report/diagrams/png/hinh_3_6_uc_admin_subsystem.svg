      <text x="460" y="710" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Quản lý khu vực di tích (Zone)</text>
      <text x="460" y="722" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Danh sách, Thêm, Sửa khu vực</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="770" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
