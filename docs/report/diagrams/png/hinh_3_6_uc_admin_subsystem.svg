      <text x="460" y="780" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Quản lý lộ trình tour (Route)</text>
      <text x="460" y="792" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Danh sách, Thêm, Sửa lộ trình</text>
