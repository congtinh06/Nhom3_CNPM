      <text x="780" y="452" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Chuyển DRAFT / PUBLISHED</text>
    </g>
  
  
    <g>
      <ellipse cx="780" cy="520" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="780" y="515" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-38A</text>
      <text x="780" y="530" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Quản lý tài khoản người dùng</text>
      <text x="780" y="542" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Danh sách, Khóa/Mở tài khoản</text>
    </g>
  
  
    <g>
      <ellipse cx="780" cy="590" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="780" y="585" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-38B</text>
      <text x="780" y="600" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Phân quyền vai trò người dùng</text>
      <text x="780" y="612" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Gán quyền USER / ADMIN</text>
    </g>
  
  
    <g>
      <ellipse cx="780" cy="680" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="780" y="675" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-39A</text>
      <text x="780" y="690" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Quản lý danh sách đơn hàng</text>
      <text x="780" y="702" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Lọc đơn PENDING, PAID, DELIVERED</text>
    </g>
  
  
    <g>
      <ellipse cx="780" cy="750" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="780" y="745" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-39B</text>
      <text x="780" y="760" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Xác nhận thanh toán &amp; Giao hàng</text>
      <text x="780" y="772" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Xác nhận VietQR, Chuyển DELIVERED</text>
    </g>
  
  
    <g>
      <ellipse cx="780" cy="840" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="780" y="835" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-40</text>
