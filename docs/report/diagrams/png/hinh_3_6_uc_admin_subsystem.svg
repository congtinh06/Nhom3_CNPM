<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 950" width="1280" height="950" style="background:#ffffff; font-family:'Times New Roman', Times, serif;">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="genArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,1 10,6 0,11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="diamond" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,6 5,2 10,6 5,10" fill="#000000" stroke="#000000" stroke-width="1"/>
    </marker>
    <marker id="openDiamond" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,6 5,2 10,6 5,10" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="32" text-anchor="middle" font-size="17" font-weight="bold">HÌNH 3.6. SƠ ĐỒ CA SỬ DỤNG PHÂN HỆ QUẢN TRỊ NỘI DUNG DI SẢN &amp; CMS</text>
  <text x="640" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">Các Chức năng Độc lập dành riêng cho Quản trị viên Di sản (Administrator)</text>

  <!-- System Boundary -->
  <rect x="260" y="75" width="760" height="850" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="260" y="75" width="460" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="270" y="93" font-size="13" font-weight="bold">Phân hệ Quản trị Di sản (Admin Console /quan-tri)</text>

  <!-- Actors -->
  
    <g transform="translate(70, 430)">
      <circle cx="20" cy="15" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="27" x2="20" y2="58" stroke="#000000" stroke-width="1.8"/>
      <line x1="0" y1="38" x2="40" y2="38" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="5" y2="85" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="35" y2="85" stroke="#000000" stroke-width="1.8"/>
      <text x="20" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">Quản trị viên</text>
      <text x="20" y="120" text-anchor="middle" font-size="10" fill="#444444" font-family="'Times New Roman', serif">(Administrator)</text>
    </g>
  
  
    <g transform="translate(1070, 240)">
      <rect x="0" y="0" width="180" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444" font-family="'Times New Roman', serif">&lt;&lt;External Storage&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">Storage Volume (Ảnh/Audio)</text>
    </g>
  
  
    <g transform="translate(1070, 600)">
      <rect x="0" y="0" width="180" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444" font-family="'Times New Roman', serif">&lt;&lt;Message Broker&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">RabbitMQ Exchange</text>
    </g>
  

  <!-- Column 1 Use Cases -->
  
    <g>
      <ellipse cx="460" cy="140" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-25</text>
      <text x="460" y="150" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Đăng nhập cổng quản trị</text>
      <text x="460" y="162" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">/quan-tri/dang-nhap</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="210" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-26</text>
      <text x="460" y="220" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Xem bảng điều khiển tổng quan</text>
      <text x="460" y="232" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">KPI POI, Doanh thu, User</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="280" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
