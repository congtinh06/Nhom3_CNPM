      <text x="460" y="290" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Xem danh mục điểm di tích (POI)</text>
      <text x="460" y="302" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Bảng danh sách, Lọc khu vực</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="350" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-28</text>
      <text x="460" y="360" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Thêm mới điểm tham quan (POI)</text>
      <text x="460" y="372" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Tọa độ, Bán kính, Thuyết minh vi</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="420" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="415" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-29</text>
      <text x="460" y="430" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Cập nhật điểm tham quan (POI)</text>
      <text x="460" y="442" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Khóa lạc quan @Version, Publish</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="490" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="485" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-30</text>
      <text x="460" y="500" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Quản lý bản dịch đa ngữ POI</text>
      <text x="460" y="512" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Duyệt 4 ngữ, Nguồn AUTO/MANUAL</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="560" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="555" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-31</text>
      <text x="460" y="570" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Quản lý và xuất mã QR POI</text>
      <text x="460" y="582" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Tải mã QR in ấn biển chỉ dẫn</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="630" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
