      <text x="780" y="370" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Xem &amp; Thêm tin tức văn hóa</text>
      <text x="780" y="382" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Soạn thảo bài viết di sản</text>
    </g>
  
  
    <g>
      <ellipse cx="780" cy="430" rx="135" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
