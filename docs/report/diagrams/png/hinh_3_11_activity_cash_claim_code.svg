<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" style="background:#ffffff; font-family:'Times New Roman', Times, serif;">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="genArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,1 10,6 0,11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="diamond" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,6 5,2 10,6 5,10" fill="#000000" stroke="#000000" stroke-width="1"/>
    </marker>
    <marker id="openDiamond" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,6 5,2 10,6 5,10" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    </marker>
  </defs>

  <text x="600" y="32" text-anchor="middle" font-size="17" font-weight="bold">HÌNH 3.11. SƠ ĐỒ HOẠT ĐỘNG: QUY TRÌNH THANH TOÁN TIỀN MẶT VÀ MÃ NHẬN QUYỀN (CLAIM CODE)</text>
  <text x="600" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">Quy trình Phối hợp Swimlanes giữa Du khách, Nhân viên Quầy vé, CMS Quầy vé, Auth/Order Service và Redis Cache</text>

  <!-- Swimlane Headers -->
  <rect x="50" y="75" width="220" height="740" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="50" y="75" width="220" height="30" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="160" y="95" text-anchor="middle" font-size="12" font-weight="bold">Du khách (Mobile App)</text>

  <rect x="270" y="75" width="230" height="740" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="270" y="75" width="230" height="30" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="385" y="95" text-anchor="middle" font-size="12" font-weight="bold">Nhân viên Quầy vé</text>

  <rect x="500" y="75" width="230" height="740" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="500" y="75" width="230" height="30" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="615" y="95" text-anchor="middle" font-size="12" font-weight="bold">CMS Quầy vé (Frontend)</text>

  <rect x="730" y="75" width="240" height="740" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="730" y="75" width="240" height="30" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="850" y="95" text-anchor="middle" font-size="12" font-weight="bold">Auth / Order Service (Backend)</text>

  <rect x="970" y="75" width="180" height="740" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="970" y="75" width="180" height="30" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="1060" y="95" text-anchor="middle" font-size="12" font-weight="bold">Redis Cache</text>

  <!-- Initial Node -->
  <circle cx="160" cy="130" r="10" fill="#000000"/>
  <line x1="160" y1="140" x2="160" y2="165" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Step 1: Select Cash -->
  <rect x="75" y="165" width="170" height="42" fill="#fafafa" stroke="#000000" stroke-width="1.2" rx="4"/>
  <text x="160" y="182" text-anchor="middle" font-size="10.5">1. Chọn thanh toán tiền mặt</text>
  <text x="160" y="197" text-anchor="middle" font-size="9.5" fill="#555555">tại quầy vé di tích</text>

  <line x1="160" y1="207" x2="160" y2="235" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Step 2: Show session_id -->
  <rect x="75" y="235" width="170" height="42" fill="#fafafa" stroke="#000000" stroke-width="1.2" rx="4"/>
  <text x="160" y="252" text-anchor="middle" font-size="10.5">2. Hiển thị session_id</text>
  <text x="160" y="267" text-anchor="middle" font-size="9.5" fill="#555555">(VD: "SES-9821")</text>

  <line x1="245" y1="256" x2="295" y2="256" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Step 3: Tourist to staff -->
  <rect x="295" y="235" width="180" height="42" fill="#fafafa" stroke="#000000" stroke-width="1.2" rx="4"/>
  <text x="385" y="252" text-anchor="middle" font-size="10.5">3. Tiếp nhận tiền mặt</text>
  <text x="385" y="267" text-anchor="middle" font-size="9.5" fill="#555555">và đọc mã session_id</text>

  <line x1="475" y1="256" x2="525" y2="256" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Step 4: Staff enters CMS -->
  <rect x="525" y="235" width="180" height="42" fill="#fafafa" stroke="#000000" stroke-width="1.2" rx="4"/>
  <text x="615" y="252" text-anchor="middle" font-size="10.5">4. Nhập session_id trên CMS</text>
  <text x="615" y="267" text-anchor="middle" font-size="9.5" fill="#555555">bấm "Xác nhận thu tiền"</text>

  <line x1="705" y1="256" x2="755" y2="256" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Step 5: Backend generates claim code -->
  <rect x="755" y="235" width="190" height="45" fill="#fafafa" stroke="#000000" stroke-width="1.2" rx="4"/>
  <text x="850" y="252" text-anchor="middle" font-size="10.5">5. Cập nhật đơn PAID</text>
  <text x="850" y="267" text-anchor="middle" font-size="9.5" fill="#555555">Sinh Claim Code 6 ký tự</text>

  <line x1="945" y1="257" x2="995" y2="257" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Step 6: Store in Redis -->
  <rect x="995" y="235" width="135" height="45" fill="#fafafa" stroke="#000000" stroke-width="1.2" rx="4"/>
  <text x="1062" y="252" text-anchor="middle" font-size="10">6. SET claim_code</text>
  <text x="1062" y="267" text-anchor="middle" font-size="9.5" fill="#555555">TTL 900s (15 phút)</text>

  <line x1="1062" y1="280" x2="1062" y2="330" stroke="#000000" stroke-width="1.3"/>
  <line x1="1062" y1="330" x2="615" y2="330" stroke="#000000" stroke-width="1.3"/>
  <line x1="615" y1="330" x2="615" y2="355" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Step 7: CMS displays claim code -->
  <rect x="525" y="355" width="180" height="42" fill="#fafafa" stroke="#000000" stroke-width="1.2" rx="4"/>
  <text x="615" y="372" text-anchor="middle" font-size="10.5">7. Hiển thị Claim Code</text>
  <text x="615" y="387" text-anchor="middle" font-size="9.5" fill="#555555">(Ví dụ: "ECH892")</text>

  <line x1="525" y1="376" x2="475" y2="376" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Step 8: Staff gives to tourist -->
  <rect x="295" y="355" width="180" height="42" fill="#fafafa" stroke="#000000" stroke-width="1.2" rx="4"/>
  <text x="385" y="372" text-anchor="middle" font-size="10.5">8. Giao phiếu / Đọc mã</text>
  <text x="385" y="387" text-anchor="middle" font-size="9.5" fill="#555555">Claim Code cho du khách</text>

  <line x1="295" y1="376" x2="245" y2="376" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Step 9: Tourist enters claim code -->
  <rect x="75" y="355" width="170" height="42" fill="#fafafa" stroke="#000000" stroke-width="1.2" rx="4"/>
  <text x="160" y="372" text-anchor="middle" font-size="10.5">9. Nhập Claim Code "ECH892"</text>
  <text x="160" y="387" text-anchor="middle" font-size="9.5" fill="#555555">bấm Kích hoạt quyền</text>

  <line x1="160" y1="397" x2="160" y2="445" stroke="#000000" stroke-width="1.3"/>
  <line x1="160" y1="445" x2="755" y2="445" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Step 10: Backend validates with Redis -->
  <rect x="755" y="425" width="190" height="45" fill="#fafafa" stroke="#000000" stroke-width="1.2" rx="4"/>
  <text x="850" y="442" text-anchor="middle" font-size="10.5">10. Tiếp nhận POST /claim-code</text>
  <text x="850" y="457" text-anchor="middle" font-size="9.5" fill="#555555">Kiểm tra mã qua Redis</text>

  <line x1="945" y1="447" x2="995" y2="447" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Step 11: Redis lookup -->
  <rect x="995" y="425" width="135" height="45" fill="#fafafa" stroke="#000000" stroke-width="1.2" rx="4"/>
  <text x="1062" y="442" text-anchor="middle" font-size="10">11. GET claim_code</text>
  <text x="1062" y="457" text-anchor="middle" font-size="9.5" fill="#555555">&amp; Kiểm tra TTL</text>

  <line x1="1062" y1="470" x2="1062" y2="510" stroke="#000000" stroke-width="1.3"/>
  <line x1="1062" y1="510" x2="880" y2="510" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Decision: Valid? -->
  <polygon points="850,495 880,515 850,535 820,515" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="850" y="548" text-anchor="middle" font-size="9.5">Mã hợp lệ?</text>

  <!-- Decision No -->
  <line x1="820" y1="515" x2="160" y2="515" stroke="#000000" stroke-width="1.3"/>
  <line x1="160" y1="515" x2="160" y2="545" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="490" y="508" text-anchor="middle" font-size="9.5">[Hết hạn / Không tìm thấy]</text>

  <rect x="75" y="545" width="170" height="40" fill="#fafafa" stroke="#000000" stroke-width="1.2" rx="4"/>
  <text x="160" y="562" text-anchor="middle" font-size="10.5">Báo lỗi: Mã hết hạn</text>
  <text x="160" y="577" text-anchor="middle" font-size="9.5" fill="#555555">hoặc không hợp lệ</text>

  <!-- Decision Yes -->
  <line x1="850" y1="495" x2="850" y2="580" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="880" y="570" font-size="9.5">[Hợp lệ]</text>

  <!-- Step 12: Delete from Redis (One-Time) -->
  <rect x="755" y="580" width="190" height="45" fill="#fafafa" stroke="#000000" stroke-width="1.2" rx="4"/>
  <text x="850" y="597" text-anchor="middle" font-size="10.5">12. Xóa mã (DEL) chống tái dùng</text>
  <text x="850" y="612" text-anchor="middle" font-size="9.5" fill="#555555">Cấp Access Token (RAM)</text>

  <line x1="755" y1="602" x2="245" y2="602" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Step 13: Tourist receives token -->
  <rect x="75" y="602" width="170" height="50" fill="#fafafa" stroke="#000000" stroke-width="1.2" rx="4"/>
  <text x="160" y="620" text-anchor="middle" font-size="10.5">13. Nhận Access Token</text>
  <text x="160" y="635" text-anchor="middle" font-size="9.5" fill="#555555">Lưu RAM (tokenStore.ts)</text>
  <text x="160" y="647" text-anchor="middle" font-size="9" fill="#000000">Mở khóa Ngoại ngữ &amp; AI</text>

  <line x1="160" y1="652" x2="160" y2="700" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Final State -->
  <circle cx="160" cy="715" r="12" fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle cx="160" cy="715" r="7" fill="#000000"/>
</svg>