
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#ffffff; font-family:'Times New Roman', Times, serif;">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="genArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,1 10,6 0,11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="32" text-anchor="middle" font-size="17" font-weight="bold">HÌNH 3.4. SƠ ĐỒ CA SỬ DỤNG PHÂN HỆ DU KHÁCH &amp; TRẢI NGHIỆM DI SẢN</text>
  <text x="600" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">Chi tiết Quan hệ giữa Khách vãng lai, Người dùng đăng ký và Các chức năng Khám phá</text>

  <!-- System Boundary -->
  <rect x="250" y="75" width="700" height="700" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="250" y="75" width="400" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="260" y="93" font-size="13" font-weight="bold">Phân hệ Du khách: Trải nghiệm Di sản Số</text>

  <!-- Actors -->
  
    <g transform="translate(70, 180)">
      <circle cx="20" cy="15" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="27" x2="20" y2="58" stroke="#000000" stroke-width="1.8"/>
      <line x1="0" y1="38" x2="40" y2="38" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="5" y2="85" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="35" y2="85" stroke="#000000" stroke-width="1.8"/>
      <text x="20" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Khách vãng lai</text>
      <text x="20" y="120" text-anchor="middle" font-size="10" fill="#444444">(Guest)</text>
    </g>
  
  
    <g transform="translate(70, 480)">
      <circle cx="20" cy="15" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="27" x2="20" y2="58" stroke="#000000" stroke-width="1.8"/>
      <line x1="0" y1="38" x2="40" y2="38" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="5" y2="85" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="35" y2="85" stroke="#000000" stroke-width="1.8"/>
      <text x="20" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Người dùng đăng ký</text>
      <text x="20" y="120" text-anchor="middle" font-size="10" fill="#444444">(Registered User)</text>
    </g>
  
  <line x1="90" y1="470" x2="90" y2="330" stroke="#000000" stroke-width="1.5" marker-end="url(#genArrow)"/>

  
    <g transform="translate(1000, 180)">
      <rect x="0" y="0" width="160" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="80" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;External Sensor&gt;&gt;</text>
      <text x="80" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Thiết bị GPS</text>
    </g>
  
  
    <g transform="translate(1000, 320)">
      <rect x="0" y="0" width="160" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="80" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;External Audio&gt;&gt;</text>
      <text x="80" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Edge-TTS Stream</text>
    </g>
  
  
    <g transform="translate(1000, 520)">
      <rect x="0" y="0" width="160" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="80" y="18" text-anchor="middle" font-size="10" fill="#444444">&lt;&lt;External Map Tile&gt;&gt;</text>
      <text x="80" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">OpenStreetMap</text>
    </g>
  

  <!-- Use Cases -->
  
    <g>
      <ellipse cx="460" cy="150" rx="125" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="147" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-01: Khám phá bản đồ di tích</text>
      <text x="460" y="162" text-anchor="middle" font-size="9.5" fill="#444444">Hiển thị 7 POI, Leaflet, Geofence</text>
    </g>
  
  
    <g>
      <ellipse cx="720" cy="240" rx="130" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="720" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-02: Nghe thuyết minh đa ngữ</text>
      <text x="720" y="252" text-anchor="middle" font-size="9.5" fill="#444444">Phát HTTP 206, Highlight phụ đề</text>
    </g>
  
  
    <g>
      <ellipse cx="720" cy="150" rx="130" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="720" y="147" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-03: Nhận thuyết minh GPS tự động</text>
      <text x="720" y="162" text-anchor="middle" font-size="9.5" fill="#444444">Haversine, Geofence 35-60m, Cửa sổ 5s</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="270" rx="120" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="267" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-04: Quét mã QR di sản</text>
      <text x="460" y="282" text-anchor="middle" font-size="9.5" fill="#444444">Giải mã QR token -> nạp POI</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="360" rx="125" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="357" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-05: Chế độ giả lập tọa độ</text>
      <text x="460" y="372" text-anchor="middle" font-size="9.5" fill="#444444">Simulation Mode, Chọn điểm dừng</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="450" rx="125" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="447" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-06: Duyệt danh mục quà lưu niệm</text>
      <text x="460" y="462" text-anchor="middle" font-size="9.5" fill="#444444">Lọc danh mục, Tìm kiếm</text>
    </g>
  
  
    <g>
      <ellipse cx="720" cy="450" rx="125" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="720" y="447" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-07: Xem chi tiết quà lưu niệm</text>
      <text x="720" y="462" text-anchor="middle" font-size="9.5" fill="#444444">Giá bán, Mô tả, Di tích liên kết</text>
    </g>
  
  
    <g>
      <ellipse cx="460" cy="560" rx="125" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="460" y="557" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-08: Duyệt bài viết tin tức di sản</text>
      <text x="460" y="572" text-anchor="middle" font-size="9.5" fill="#444444">Danh sách bài viết văn hóa</text>
    </g>
  
  
    <g>
      <ellipse cx="720" cy="560" rx="125" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="720" y="557" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-09: Đọc chi tiết tin tức di sản</text>
      <text x="720" y="572" text-anchor="middle" font-size="9.5" fill="#444444">Nội dung chi tiết theo slug</text>
    </g>
  
  
    <g>
      <ellipse cx="720" cy="360" rx="125" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="720" y="357" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">UC-Ext: Kiểm tra bản quyền ngoại ngữ</text>
      <text x="720" y="372" text-anchor="middle" font-size="9.5" fill="#444444">Khóa cước FREE -&gt; yêu cầu Premium</text>
    </g>
  

  <!-- Associations -->
  <line x1="110" y1="210" x2="335" y2="150" stroke="#000000" stroke-width="1.2"/>
  <line x1="110" y1="210" x2="590" y2="240" stroke="#000000" stroke-width="1.2"/>
  <line x1="110" y1="210" x2="340" y2="270" stroke="#000000" stroke-width="1.2"/>
  <line x1="110" y1="210" x2="335" y2="360" stroke="#000000" stroke-width="1.2"/>
  <line x1="110" y1="210" x2="335" y2="450" stroke="#000000" stroke-width="1.2"/>
  <line x1="110" y1="210" x2="335" y2="560" stroke="#000000" stroke-width="1.2"/>

  <!-- External Associations -->
  <line x1="1000" y1="200" x2="850" y2="155" stroke="#000000" stroke-width="1.2"/>
  <line x1="1000" y1="340" x2="850" y2="250" stroke="#000000" stroke-width="1.2"/>
  <line x1="1000" y1="540" x2="585" y2="160" stroke="#000000" stroke-width="1.2"/>

  <!-- Relations -->
  <!-- UC-03 includes UC-02 -->
  <line x1="720" y1="174" x2="720" y2="216" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="755" y="198" text-anchor="middle" font-size="9.5" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-04 includes UC-02 -->
  <line x1="575" y1="260" x2="595" y2="250" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="590" y="275" text-anchor="middle" font-size="9.5" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-02 extends UC-Ext -->
  <line x1="720" y1="264" x2="720" y2="336" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="755" y="305" text-anchor="middle" font-size="9.5" font-style="italic">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC-06 extends UC-07 -->
  <line x1="585" y1="450" x2="595" y2="450" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="590" y="442" text-anchor="middle" font-size="9.5" font-style="italic">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC-08 extends UC-09 -->
  <line x1="585" y1="560" x2="595" y2="560" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="590" y="552" text-anchor="middle" font-size="9.5" font-style="italic">&lt;&lt;extend&gt;&gt;</text>
</svg>
