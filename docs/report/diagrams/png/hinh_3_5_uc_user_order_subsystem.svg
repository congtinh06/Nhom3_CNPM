<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" style="background:#ffffff; font-family:'Times New Roman', Times, serif;">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="genArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,1 10,6 0,11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="diamond" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,6 5,2 10,6 5,10" fill="#000000" stroke="#000000" stroke-width="1"/>
    </marker>
    <marker id="openDiamond" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,6 5,2 10,6 5,10" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="32" text-anchor="middle" font-size="17" font-weight="bold">HÌNH 3.5. SƠ ĐỒ CA SỬ DỤNG PHÂN HỆ TÀI KHOẢN, GIỎ HÀNG &amp; THANH TOÁN</text>
  <text x="600" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">Chi tiết Luồng Xác thực Kép, Quản lý Giỏ hàng, Gói Premium và Cổng Thanh toán VNPAY/VietQR</text>

  <!-- System Boundary -->
  <rect x="240" y="75" width="720" height="760" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="240" y="75" width="430" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="250" y="93" font-size="13" font-weight="bold">Phân hệ Người dùng, Giỏ hàng &amp; Giao dịch Tài chính</text>

  <!-- Actors -->
  
    <g transform="translate(60, 360)">
      <circle cx="20" cy="15" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="27" x2="20" y2="58" stroke="#000000" stroke-width="1.8"/>
      <line x1="0" y1="38" x2="40" y2="38" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="5" y2="85" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="35" y2="85" stroke="#000000" stroke-width="1.8"/>
      <text x="20" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">Người dùng đăng ký</text>
      <text x="20" y="120" text-anchor="middle" font-size="10" fill="#444444" font-family="'Times New Roman', serif">(Registered User)</text>
    </g>
  

  
    <g transform="translate(1010, 160)">
      <rect x="0" y="0" width="160" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="80" y="18" text-anchor="middle" font-size="10" fill="#444444" font-family="'Times New Roman', serif">&lt;&lt;External Auth&gt;&gt;</text>
      <text x="80" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">Google Identity</text>
    </g>
  
  
    <g transform="translate(1010, 520)">
      <rect x="0" y="0" width="160" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="80" y="18" text-anchor="middle" font-size="10" fill="#444444" font-family="'Times New Roman', serif">&lt;&lt;Payment Gateway&gt;&gt;</text>
      <text x="80" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">VNPAY Sandbox</text>
    </g>
  
  
    <g transform="translate(1010, 640)">
      <rect x="0" y="0" width="160" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="80" y="18" text-anchor="middle" font-size="10" fill="#444444" font-family="'Times New Roman', serif">&lt;&lt;Banking Network&gt;&gt;</text>
      <text x="80" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">NAPAS VietQR</text>
    </g>
  

  <!-- Use Cases: Auth & Profile -->
  
    <g>
      <ellipse cx="430" cy="140" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="430" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-10</text>
      <text x="430" y="150" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Đăng ký tài khoản mới</text>
      
    </g>
  
  
    <g>
      <ellipse cx="730" cy="140" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="730" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-11/12</text>
      <text x="730" y="150" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Xác thực email & Quên MK</text>
      
    </g>
  
  
    <g>
      <ellipse cx="430" cy="210" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="430" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-13</text>
      <text x="430" y="220" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Đăng nhập mật khẩu</text>
      <text x="430" y="232" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">RAM Token + HttpOnly Cookie</text>
    </g>
  
  
    <g>
      <ellipse cx="730" cy="210" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="730" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-14</text>
      <text x="730" y="220" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Đăng nhập Google OAuth2</text>
      
    </g>
  
  
    <g>
      <ellipse cx="430" cy="280" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="430" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-15</text>
      <text x="430" y="290" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Đăng nhập quét mã QR</text>
      <text x="430" y="302" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Phiên làm việc QrLogin</text>
    </g>
  
  
    <g>
      <ellipse cx="730" cy="280" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="730" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-16/17</text>
      <text x="730" y="290" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Hồ sơ cá nhân & Đăng xuất</text>
      
    </g>
  

  <!-- Use Cases: Cart, Order & Payment -->
  
    <g>
      <ellipse cx="430" cy="380" rx="125" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="430" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-18</text>
      <text x="430" y="390" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Quản lý giỏ hàng quà</text>
      <text x="430" y="402" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Thêm, sửa số lượng, FreeShip &gt;=50k</text>
    </g>
  
  
    <g>
      <ellipse cx="430" cy="480" rx="125" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="430" y="475" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-19</text>
      <text x="430" y="490" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Đặt hàng quà lưu niệm</text>
      <text x="430" y="502" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Địa chỉ nhận, Idempotency-Key</text>
    </g>
  
  
    <g>
      <ellipse cx="430" cy="580" rx="125" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="430" y="575" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-20</text>
      <text x="430" y="590" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Mua gói ngoại ngữ Premium</text>
      <text x="430" y="602" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Gói 500,000 VND/năm, Hạn 15m</text>
    </g>
  
  
  
    <g>
      <ellipse cx="730" cy="530" rx="130" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="730" y="525" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-21</text>
      <text x="730" y="540" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Thanh toán online VNPAY</text>
      <text x="730" y="552" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">HMAC-SHA512, Return URL, IPN</text>
    </g>
  
  
    <g>
      <ellipse cx="730" cy="630" rx="130" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="730" y="625" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-22</text>
      <text x="730" y="640" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Thanh toán chuyển khoản VietQR</text>
      <text x="730" y="652" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Chuẩn NAPAS, Chờ xác nhận</text>
    </g>
  

  
    <g>
      <ellipse cx="430" cy="690" rx="125" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="430" y="685" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-23</text>
      <text x="430" y="700" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Hủy đơn hàng chờ xử lý</text>
      <text x="430" y="712" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Chuyển sang CANCELLED</text>
    </g>
  
  
    <g>
      <ellipse cx="730" cy="730" rx="130" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="730" y="725" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-24</text>
      <text x="730" y="740" text-anchor="middle" font-size="10.5" fill="#000000" font-family="'Times New Roman', serif">Xem lịch sử & Chi tiết đơn</text>
      <text x="730" y="752" text-anchor="middle" font-size="9" fill="#444444" font-family="'Times New Roman', serif">Tra cứu mã đơn, Trạng thái</text>
    </g>
  

  <!-- Associations -->
  <line x1="100" y1="400" x2="310" y2="140" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="400" x2="310" y2="210" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="400" x2="310" y2="280" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="400" x2="305" y2="380" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="400" x2="305" y2="480" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="400" x2="305" y2="580" stroke="#000000" stroke-width="1.2"/>
  <line x1="100" y1="400" x2="305" y2="690" stroke="#000000" stroke-width="1.2"/>

  <!-- External Associations -->
  <line x1="1010" y1="180" x2="850" y2="210" stroke="#000000" stroke-width="1.2"/>
  <line x1="1010" y1="540" x2="860" y2="530" stroke="#000000" stroke-width="1.2"/>
  <line x1="1010" y1="660" x2="860" y2="630" stroke="#000000" stroke-width="1.2"/>

  <!-- Includes -->
  <!-- UC-19 includes UC-21 -->
  <line x1="550" y1="495" x2="630" y2="515" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="590" y="495" text-anchor="middle" font-size="9" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-19 includes UC-22 -->
  <line x1="540" y1="500" x2="640" y2="615" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="575" y="560" text-anchor="middle" font-size="9" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-20 includes UC-21 -->
  <line x1="550" y1="565" x2="620" y2="545" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="585" y="568" text-anchor="middle" font-size="9" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-20 includes UC-22 -->
  <line x1="550" y1="595" x2="620" y2="615" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="585" y="618" text-anchor="middle" font-size="9" font-style="italic">&lt;&lt;include&gt;&gt;</text>
</svg>