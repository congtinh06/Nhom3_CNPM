services:
  # ==========================================
  # 1. Message Broker (RabbitMQ + Management)
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: antiphishing_secret_cookie_2026
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - antiphishing-net

  # ==========================================
  # 2. Microsoft SQL Server 2022 (Mỗi service 1 instance riêng biệt)
  #    Chuyển đổi từ PostgreSQL (2026-09). Cấu hình PostgreSQL cũ được
  #    comment lại ở cuối file làm backup.
  # ==========================================
  mssql-link:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-link
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: ${MSSQL_PID:-Developer}   # Developer cho nội bộ; đổi thành Express nếu cần
    ports:
      - "1433:1433"
    volumes:
      - mssql-data-link:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - antiphishing-net

  mssql-report:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-report
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "1434:1433"
    volumes:
      - mssql-data-report:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - antiphishing-net

  mssql-notification:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-notification
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "1435:1433"
    volumes:
      - mssql-data-notification:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - antiphishing-net

  # ==========================================
  # 2b. Init + Seed databases (chạy 1 lần)
  #     SQL Server không tự tạo database qua biến môi trường như PostgreSQL
  #     (POSTGRES_DB), nên cần tạo DB bằng T-SQL sau khi container healthy.
  #     Sau đó seed DDL + data từ docs/schema.sql (mount read-only; file được
  #     tách theo marker "-- SECTION-DB: <ten_db>" để chạy với đúng database).
  #     Script seed idempotent — chạy lại không lỗi, không nhân đôi data.
  # ==========================================
  mssql-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-db-init
    depends_on:
      mssql-link:
        condition: service_healthy
      mssql-report:
        condition: service_healthy
      mssql-notification:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
    volumes:
      - ./docs/schema.sql:/seed/schema.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        SEED_FILE=/seed/schema.sql
        DB1=link_verification_db
        DB2=report_db
        DB3=notification_db

        # ---------- Giai đoạn 1: tạo database nếu chưa có ----------
        create_db() {
          host=$$1; db=$$2
          echo "Ensuring database [$$db] on $$host ..."
          for i in $$(seq 1 60); do
            if $$SQLCMD -S "$$host" -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "IF DB_ID('$$db') IS NULL CREATE DATABASE [$$db]"; then
              echo "Database [$$db] ready on $$host"
              return 0
            fi
            sleep 5
          done
          echo "FAILED to create database [$$db] on $$host"
          return 1
        }
        create_db mssql-link "$$DB1"
        create_db mssql-report "$$DB2"
        create_db mssql-notification "$$DB3"

        # ---------- Giai đoạn 2: seed DDL + data từ docs/schema.sql ----------
        # Tách phần của từng database theo marker "-- SECTION-DB: <ten_db>"
        # rồi chạy với sqlcmd -d <db>.
        seed_db() {
          host=$$1; db=$$2
          echo "Seeding [$$db] on $$host ..."
          awk -v marker="-- SECTION-DB: $$db" '
            index($$0, marker) == 1 { keep = 1; next }
            /^-- SECTION-DB:/ { keep = 0 }
            keep { print }
          ' "$$SEED_FILE" > "/tmp/$$db.sql"
          for i in $$(seq 1 30); do
            if $$SQLCMD -S "$$host" -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -i "/tmp/$$db.sql"; then
              echo "Seed [$$db] completed"
              return 0
            fi
            echo "Seed [$$db] retry $$i/30 ..."
            sleep 5
          done
          echo "FAILED seeding [$$db] on $$host"
          return 1
        }
        seed_db mssql-link "$$DB1"
        seed_db mssql-report "$$DB2"
        seed_db mssql-notification "$$DB3"

        echo "All databases are created and seeded."
    networks:
      - antiphishing-net

  # ==========================================
  # 3. Microservices Nghiệp Vụ
  # ==========================================
  link-verification-service:
    build:
      context: ./backend/link-verification-service
      dockerfile: Dockerfile
    container_name: link-verification-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:sqlserver://mssql-link:1433;databaseName=link_verification_db;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      GSB_API_KEY: ${GSB_API_KEY:-}
      PHISHTANK_APP_KEY: ${PHISHTANK_APP_KEY:-}
      VERIFICATION_MOCK_MODE: ${VERIFICATION_MOCK_MODE:-false}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      mssql-db-init:
        condition: service_completed_successfully
    networks:
      - antiphishing-net

  report-service:
    build:
      context: ./backend/report-service
      dockerfile: Dockerfile
    container_name: report-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:sqlserver://mssql-report:1433;databaseName=report_db;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      LINK_VERIFICATION_SERVICE_URL: http://link-verification-service:8082
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      mssql-db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      link-verification-service:
        condition: service_started
    networks:
      - antiphishing-net

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:sqlserver://mssql-notification:1433;databaseName=notification_db;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@anti-phishing-bank.example.com}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_TO_NUMBER_DEMO: ${TWILIO_TO_NUMBER_DEMO:-}
      NARRATION_SERVICE_URL: http://narration-service:8084
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      mssql-db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - antiphishing-net

  narration-service:
    build:
      context: ./backend/narration-service
      dockerfile: Dockerfile
    container_name: narration-service
    ports:
      - "8084:8084"
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    networks:
      - antiphishing-net

  poi-service:
    build:
      context: ./backend/poi-service
      dockerfile: Dockerfile
    container_name: poi-service
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:sqlserver://mssql-link:1433;databaseName=link_verification_db;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      mssql-db-init:
        condition: service_completed_successfully
    networks:
      - antiphishing-net

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      REPORT_SERVICE_URL: http://report-service:8081
      LINK_VERIFICATION_SERVICE_URL: http://link-verification-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      NARRATION_SERVICE_URL: http://narration-service:8084
      POI_SERVICE_URL: http://poi-service:8085
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Fix 401 (2026-09): gateway dung key nay de gan header X-Internal-Api-Key
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      - report-service
      - link-verification-service
      - notification-service
      - narration-service
      - poi-service
    networks:
      - antiphishing-net

networks:
  antiphishing-net:
    driver: bridge

volumes:
  mssql-data-link:
  mssql-data-report:
  mssql-data-notification:
  rabbitmq-data:

