services:
  # ==========================================
  # 1. Message Broker (RabbitMQ + Management)
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    hostname: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15800:15672"
    environment:
      # User riêng thay guest. Chỉ được tạo khi volume rabbitmq-data còn trống (lần đầu / sau down -v)
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required in .env}
      RABBITMQ_ERLANG_COOKIE: echora_secret_cookie_2026
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - echora-net

  # ==========================================
  # 2. Microsoft SQL Server 2022 (1 Instance duy nhất trên port 1433)
  #    Chạy 5 database độc lập: content, translation, analytics, auth, order
  # ==========================================
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required in .env}
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - echora-net

  # ==========================================
  #   2b. Khởi tạo 5 Databases & 5 Logins riêng biệt (Chạy 1 lần)
  #     Đợi mssql healthy -> chạy docker/init-databases.sql qua sqlcmd
  #     Phân quyền cô lập: mỗi user chỉ có quyền trên database của mình
  # ==========================================
  mssql-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-db-init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required in .env}
      CONTENT_DB_USER: ${CONTENT_DB_USER:-content_user}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:?CONTENT_DB_PASSWORD is required in .env}
      TRANSLATION_DB_USER: ${TRANSLATION_DB_USER:-translation_user}
      TRANSLATION_DB_PASSWORD: ${TRANSLATION_DB_PASSWORD:?TRANSLATION_DB_PASSWORD is required in .env}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:-analytics_user}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required in .env}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required in .env}
      ORDER_DB_USER: ${ORDER_DB_USER:-order_user}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required in .env}
    volumes:
      - ./docker/init-databases.sql:/init/init-databases.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        echo "Waiting for SQL Server to be ready on mssql:1433..."
        for i in $$(seq 1 30); do
          if $$SQLCMD -S mssql -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "SELECT 1" > /dev/null 2>&1; then
            echo "SQL Server connection verified!"
            break
          fi
          echo "SQL Server retry $$i/30..."
          sleep 3
        done

        echo "Executing init-databases.sql..."
        $$SQLCMD -S mssql -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b \
          -v CONTENT_DB_USER="$${CONTENT_DB_USER}" \
          -v CONTENT_DB_PASSWORD="$${CONTENT_DB_PASSWORD}" \
          -v TRANSLATION_DB_USER="$${TRANSLATION_DB_USER}" \
          -v TRANSLATION_DB_PASSWORD="$${TRANSLATION_DB_PASSWORD}" \
          -v ANALYTICS_DB_USER="$${ANALYTICS_DB_USER}" \
          -v ANALYTICS_DB_PASSWORD="$${ANALYTICS_DB_PASSWORD}" \
          -v AUTH_DB_USER="$${AUTH_DB_USER}" \
          -v AUTH_DB_PASSWORD="$${AUTH_DB_PASSWORD}" \
          -v ORDER_DB_USER="$${ORDER_DB_USER}" \
          -v ORDER_DB_PASSWORD="$${ORDER_DB_PASSWORD}" \
          -i /init/init-databases.sql

        echo "5 databases, logins, and isolated permissions initialized successfully!"
    networks:
      - echora-net

  # ==========================================
  # 3. Microservices Nghiệp Vụ (Echora)
  # ==========================================
  content-service:
    build:
      context: ./backend/content-service
      dockerfile: Dockerfile
    container_name: content-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      DB_URL: jdbc:sqlserver://mssql:1433;databaseName=echora_content_db;encrypt=true;trustServerCertificate=true
      DB_USERNAME: ${CONTENT_DB_USER:-content_user}
      DB_PASSWORD: ${CONTENT_DB_PASSWORD:?CONTENT_DB_PASSWORD is required in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      AUTH_SERVICE_URL: http://auth-service:8086
      PRODUCT_UPLOAD_DIR: /app/uploads/products
    volumes:
      - product-uploads-data:/app/uploads/products
    depends_on:
      mssql-db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - echora-net

  location-service:
    build:
      context: ./backend/location-service
      dockerfile: Dockerfile
    container_name: location-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      CONTENT_SERVICE_URL: http://content-service:8085
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      content-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - echora-net

  translation-tts-service:
    build:
      context: ./backend/translation-tts-service
      dockerfile: Dockerfile
    container_name: translation-tts-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      DB_URL: jdbc:sqlserver://mssql:1433;databaseName=echora_translation_db;encrypt=true;trustServerCertificate=true
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      AUTH_SERVICE_URL: http://auth-service:8086
      DB_USERNAME: ${TRANSLATION_DB_USER:-translation_user}
      DB_PASSWORD: ${TRANSLATION_DB_PASSWORD:?TRANSLATION_DB_PASSWORD is required in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required in .env}
      ECHORA_STORAGE_TYPE: ${ECHORA_STORAGE_TYPE:-local}
      AUDIO_STORAGE_DIR: /app/storage/audio
      AUDIO_PUBLIC_BASE_URL: ${AUDIO_PUBLIC_BASE_URL:-}
      MYMEMORY_EMAIL: ${MYMEMORY_EMAIL:-}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-seed}
      TTS_TIMEOUT_MS: ${TTS_TIMEOUT_MS:-120000}
    volumes:
      - audio-storage-data:/app/storage/audio
    depends_on:
      mssql-db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      content-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - echora-net

  analytics-service:
    build:
      context: ./backend/analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      DB_URL: jdbc:sqlserver://mssql:1433;databaseName=echora_analytics_db;encrypt=true;trustServerCertificate=true
      DB_USERNAME: ${ANALYTICS_DB_USER:-analytics_user}
      DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required in .env}
      CONTENT_SERVICE_URL: http://content-service:8085
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      mssql-db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      content-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - echora-net

  # ==========================================
  # 3b. Auth Service — Đăng ký / Đăng nhập / JWT (port 8086)
  # ==========================================
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      DB_URL: jdbc:sqlserver://mssql:1433;databaseName=echora_auth_db;encrypt=true;trustServerCertificate=true
      DB_USERNAME: ${AUTH_DB_USER:-auth_user}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required in .env}
      # Bắt buộc: secret >= 32 ký tự. Để trống thì service không khởi động được (fail-closed).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Google OAuth Client ID (loại Web). Để trống -> /api/auth/google trả 503; không dùng client secret.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Cookie Secure=true chỉ chạy được sau HTTPS -> mặc định false cho môi trường dev.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Echora <no-reply@echora.local>}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-quantri@echora.test}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      SEED_TEST_USER_EMAIL: ${SEED_TEST_USER_EMAIL:-user@echora.local}
      SEED_TEST_USER_PASSWORD: ${SEED_TEST_USER_PASSWORD:-User@123456}
    depends_on:
      mssql-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - echora-net

  # ==========================================
  # 3c. Order Service — Đơn hàng gắn tài khoản + VNPAY (port 8087)
  # ==========================================
  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      DB_URL: jdbc:sqlserver://mssql:1433;databaseName=echora_order_db;encrypt=true;trustServerCertificate=true
      DB_USERNAME: ${ORDER_DB_USER:-order_user}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      CONTENT_SERVICE_URL: http://content-service:8085
      AUTH_SERVICE_URL: http://auth-service:8086
      ORDER_SHIPPING_FEE: ${ORDER_SHIPPING_FEE:-20000}
      ORDER_FREE_SHIPPING_THRESHOLD: ${ORDER_FREE_SHIPPING_THRESHOLD:-50000}
      ORDER_PREMIUM_PRICE: ${ORDER_PREMIUM_PRICE:-500000}
      ORDER_PREMIUM_POI_PRICE: ${ORDER_PREMIUM_POI_PRICE:-20000}
      PAYMENTS_MOCK_ENABLED: ${PAYMENTS_MOCK_ENABLED:-true}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8080/api/orders/vnpay/return}
      VNPAY_FRONTEND_RESULT_URL: ${VNPAY_FRONTEND_RESULT_URL:-http://localhost:5173/thanh-toan/ket-qua}
      VNPAY_LOCALE: ${VNPAY_LOCALE:-vn}
      VNPAY_ORDER_TYPE: ${VNPAY_ORDER_TYPE:-other}
      VNPAY_EXPIRE_MINUTES: ${VNPAY_EXPIRE_MINUTES:-15}
    depends_on:
      mssql-db-init:
        condition: service_completed_successfully
      content-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8087/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - echora-net

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-18080}:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      CONTENT_SERVICE_URL: http://content-service:8085
      LOCATION_SERVICE_URL: http://location-service:8082
      TRANSLATION_TTS_SERVICE_URL: http://translation-tts-service:8083
      ANALYTICS_SERVICE_URL: http://analytics-service:8081
      AUTH_SERVICE_URL: http://auth-service:8086
      ORDER_SERVICE_URL: http://order-service:8087
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      FRONTEND_URLS: ${FRONTEND_URLS:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      content-service:
        condition: service_started
      location-service:
        condition: service_started
      auth-service:
        condition: service_started
      order-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - echora-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:${FRONTEND_HOST_PORT:-8088}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - echora-net

networks:
  echora-net:
    driver: bridge

volumes:
  mssql-data:
  rabbitmq-data:
  audio-storage-data:
  # Lưu trữ ảnh sản phẩm tải lên phục vụ GET /img/products/**
  # Backup: docker run --rm -v product-uploads-data:/data -v ${PWD}:/backup alpine tar czf /backup/product-uploads.tar.gz -C /data .
  # Restore: docker run --rm -v product-uploads-data:/data -v ${PWD}:/backup alpine tar xzf /backup/product-uploads.tar.gz -C /data
  product-uploads-data:
