# ====================================================================
# Render Blueprint (Infrastructure-as-Code) - SaigonVoice
# Tự động hóa triển khai Spring Boot Microservices lên Render.com (Dự phòng)
# ====================================================================

services:
  # 1. Location Service
  - type: web
    name: location-service
    runtime: docker
    dockerfilePath: ./backend/location-service/Dockerfile
    dockerContext: ./backend/location-service
    plan: free
    envVars:
      - key: CONTENT_SERVICE_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false

  # 2. Analytics Service
  - type: web
    name: analytics-service
    runtime: docker
    dockerfilePath: ./backend/analytics-service/Dockerfile
    dockerContext: ./backend/analytics-service
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USERNAME
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: LOCATION_SERVICE_URL
        fromService:
          name: location-service
          type: web
          property: hostport
      - key: INTERNAL_API_KEY
        sync: false

  # 3. Translation & TTS Service
  - type: web
    name: translation-tts-service
    runtime: docker
    dockerfilePath: ./backend/translation-tts-service/Dockerfile
    dockerContext: ./backend/translation-tts-service
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USERNAME
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: CONTENT_SERVICE_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false

  # 4. Content Service
  - type: web
    name: content-service
    runtime: docker
    dockerfilePath: ./backend/content-service/Dockerfile
    dockerContext: ./backend/content-service
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: INTERNAL_API_KEY
        sync: false

  # 5. Spring Cloud API Gateway
  - type: web
    name: api-gateway
    runtime: docker
    dockerfilePath: ./backend/api-gateway/Dockerfile
    dockerContext: ./backend/api-gateway
    plan: free
    envVars:
      - key: CONTENT_SERVICE_URL
        fromService:
          name: content-service
          type: web
          property: hostport
      - key: LOCATION_SERVICE_URL
        fromService:
          name: location-service
          type: web
          property: hostport
      - key: TRANSLATION_TTS_SERVICE_URL
        fromService:
          name: translation-tts-service
          type: web
          property: hostport
      - key: ANALYTICS_SERVICE_URL
        fromService:
          name: analytics-service
          type: web
          property: hostport
      - key: FRONTEND_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
