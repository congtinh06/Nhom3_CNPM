    </g>
  
  
    <g>
      <ellipse cx="800" cy="730" rx="150" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="800" y="734" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-11: Kích hoạt Pipeline Edge-TTS</text>
      
    </g>
  
  
    <g>
      <ellipse cx="440" cy="860" rx="150" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="440" y="864" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-12: Quản trị người dùng &amp; Phân quyền</text>
      
