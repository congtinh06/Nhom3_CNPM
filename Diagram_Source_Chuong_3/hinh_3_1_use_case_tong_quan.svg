    </g>
  
  
    <g>
      <ellipse cx="1020" cy="255" rx="135" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="1020" y="259" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-05: Chuyển đổi ngôn ngữ thuyết minh</text>
      
    </g>
  

  <!-- Subsystem 1 Relationships -->
  <!-- UC-02 include UC-04 -->
  <line x1="730" y1="185" x2="730" y2="230" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
