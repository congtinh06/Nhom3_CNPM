      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">RabbitMQ Broker</text>
    </g>
  
  
    <g transform="translate(1230, 840)">
      <rect x="0" y="0" width="180" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
