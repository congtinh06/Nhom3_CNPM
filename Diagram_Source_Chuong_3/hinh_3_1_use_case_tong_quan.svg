      <text x="410" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-01: Khám phá bản đồ di tích</text>
      
    </g>
  
  
    <g>
      <ellipse cx="730" cy="160" rx="140" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="730" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-02: Nhận thuyết minh GPS tự động</text>
      
    </g>
  
  
    <g>
      <ellipse cx="410" cy="255" rx="135" ry="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
