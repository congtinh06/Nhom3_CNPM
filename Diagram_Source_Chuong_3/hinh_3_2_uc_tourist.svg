<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" style="background:#ffffff; font-family:'Times New Roman', Times, serif;">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="genArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,1 10,6 0,11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
  </defs>


  <!-- Title -->
  <text x="640" y="32" text-anchor="middle" font-size="17" font-weight="bold" font-family="'Times New Roman', serif">HÌNH 3.2. SƠ ĐỒ CA SỬ DỤNG PHÂN HỆ DU KHÁCH &amp; TRẢI NGHIỆM DI SẢN</text>
  <text x="640" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#333333" font-family="'Times New Roman', serif">Chi tiết 5 Ca sử dụng Trọng tâm phục vụ Du khách Tham quan Thực địa và Khám phá Số</text>

  <!-- System Boundary -->
  <rect x="250" y="75" width="760" height="710" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="250" y="75" width="460" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="260" y="93" font-size="13" font-weight="bold" font-family="'Times New Roman', serif">Phân hệ Du khách: Trải nghiệm Di sản Số (Tourist Subsystem)</text>

  <!-- Left: Actors -->
  
    <g transform="translate(70, 200)">
      <circle cx="20" cy="15" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="27" x2="20" y2="58" stroke="#000000" stroke-width="1.8"/>
      <line x1="0" y1="38" x2="40" y2="38" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="5" y2="85" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="35" y2="85" stroke="#000000" stroke-width="1.8"/>
      <text x="20" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">Khách vãng lai</text>
      <text x="20" y="120" text-anchor="middle" font-size="10" fill="#444444" font-family="'Times New Roman', serif">(Guest Tourist)</text>
    </g>
  
  
    <g transform="translate(70, 500)">
      <circle cx="20" cy="15" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="27" x2="20" y2="58" stroke="#000000" stroke-width="1.8"/>
      <line x1="0" y1="38" x2="40" y2="38" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="5" y2="85" stroke="#000000" stroke-width="1.8"/>
      <line x1="20" y1="58" x2="35" y2="85" stroke="#000000" stroke-width="1.8"/>
      <text x="20" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">Người dùng đăng ký</text>
      <text x="20" y="120" text-anchor="middle" font-size="10" fill="#444444" font-family="'Times New Roman', serif">(Registered User)</text>
    </g>
  

  <!-- Generalization: Registered User -> Guest -->
  <line x1="90" y1="490" x2="90" y2="350" stroke="#000000" stroke-width="1.5" marker-end="url(#genArrow)"/>

  <!-- Right: External Actors -->
  
    <g transform="translate(1050, 160)">
      <rect x="0" y="0" width="180" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444" font-family="'Times New Roman', serif">&lt;&lt;External Sensor&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">Cảm biến GPS</text>
    </g>
  
  
    <g transform="translate(1050, 360)">
      <rect x="0" y="0" width="180" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444" font-family="'Times New Roman', serif">&lt;&lt;External Audio Engine&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">Web Speech / Audio API</text>
    </g>
  
  
    <g transform="translate(1050, 560)">
      <rect x="0" y="0" width="180" height="45" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" fill="#444444" font-family="'Times New Roman', serif">&lt;&lt;External Map Tile&gt;&gt;</text>
      <text x="90" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">Bản đồ OpenStreetMap</text>
    </g>
  

  <!-- 5 Use Cases inside Boundary -->
  
    <g>
      <ellipse cx="450" cy="180" rx="145" ry="27" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="450" y="177" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-01: Khám phá bản đồ di tích</text>
      <text x="450" y="193" text-anchor="middle" font-size="9.5" fill="#444444" font-family="'Times New Roman', serif">Hiển thị 7 POI, Leaflet, Bán kính Geofence</text>
    </g>
  
  
    <g>
      <ellipse cx="760" cy="180" rx="145" ry="27" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="760" y="177" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-02: Nhận thuyết minh GPS tự động</text>
      <text x="760" y="193" text-anchor="middle" font-size="9.5" fill="#444444" font-family="'Times New Roman', serif">Haversine, Geofence 35-60m, Cửa sổ trễ 10s</text>
    </g>
  
  
    <g>
      <ellipse cx="450" cy="360" rx="145" ry="27" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="450" y="357" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-03: Quét mã QR hiện vật</text>
      <text x="450" y="373" text-anchor="middle" font-size="9.5" fill="#444444" font-family="'Times New Roman', serif">WebRTC Camera, Quét token hiện vật trong nhà</text>
    </g>
  
  
    <g>
      <ellipse cx="760" cy="360" rx="145" ry="27" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="760" y="357" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-04: Điều khiển phát âm thanh đa ngữ</text>
      <text x="760" y="373" text-anchor="middle" font-size="9.5" fill="#444444" font-family="'Times New Roman', serif">Play/Pause/Tua, Phụ đề chạy chữ, Fallback TTS</text>
    </g>
  
  
    <g>
      <ellipse cx="600" cy="560" rx="155" ry="27" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="600" y="557" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000" font-family="'Times New Roman', serif">UC-05: Chuyển đổi ngôn ngữ thuyết minh</text>
      <text x="600" y="573" text-anchor="middle" font-size="9.5" fill="#444444" font-family="'Times New Roman', serif">4 ngôn ngữ: Tiếng Việt, Tiếng Anh, Nhật, Hàn</text>
    </g>
  

  <!-- Include / Extend Relationships -->
  <!-- UC-02 include UC-04 -->
  <line x1="760" y1="208" x2="760" y2="332" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="765" y="270" font-size="10" fill="#333333" font-family="'Times New Roman', serif">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-03 include UC-04 -->
  <line x1="596" y1="360" x2="614" y2="360" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="605" y="352" text-anchor="middle" font-size="10" fill="#333333" font-family="'Times New Roman', serif">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-05 extend UC-04 -->
  <line x1="685" y1="535" x2="725" y2="388" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="720" y="470" font-size="10" fill="#333333" font-family="'Times New Roman', serif">&lt;&lt;extend&gt;&gt;</text>

  <!-- Guest to Use Cases -->
  <line x1="110" y1="230" x2="304" y2="180" stroke="#000000" stroke-width="1.2"/>
  <line x1="110" y1="240" x2="450" y2="145" stroke="#000000" stroke-width="1.2"/>
  <line x1="450" y1="145" x2="625" y2="175" stroke="#000000" stroke-width="1.2"/>
  <line x1="110" y1="255" x2="304" y2="360" stroke="#000000" stroke-width="1.2"/>
  <line x1="110" y1="270" x2="445" y2="560" stroke="#000000" stroke-width="1.2"/>

  <!-- External Sensors -->
  <line x1="1050" y1="180" x2="906" y2="180" stroke="#000000" stroke-width="1.2"/>
  <line x1="1050" y1="380" x2="906" y2="365" stroke="#000000" stroke-width="1.2"/>

  <!-- OpenStreetMap line around top to UC-01 -->
  <line x1="1050" y1="580" x2="980" y2="580" stroke="#000000" stroke-width="1.2"/>
  <line x1="980" y1="580" x2="980" y2="135" stroke="#000000" stroke-width="1.2"/>
  <line x1="980" y1="135" x2="570" y2="135" stroke="#000000" stroke-width="1.2"/>
  <line x1="570" y1="135" x2="550" y2="157" stroke="#000000" stroke-width="1.2"/>

</svg>