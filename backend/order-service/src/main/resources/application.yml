server:
  port: 8087

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=echora_order_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:order_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

internal:
  api-key: ${INTERNAL_API_KEY:}

app:
  content-service:
    url: ${CONTENT_SERVICE_URL:http://localhost:8085}
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8086}
  pricing:
    shipping-fee: ${ORDER_SHIPPING_FEE:20000}
    free-shipping-threshold: ${ORDER_FREE_SHIPPING_THRESHOLD:50000}
  premium:
    price: ${ORDER_PREMIUM_PRICE:500000}
    poi-price: ${ORDER_PREMIUM_POI_PRICE:100000}
    access-days: ${ORDER_PREMIUM_ACCESS_DAYS:365}
  payments:
    # Mặc định TẮT. Bật bằng PAYMENTS_MOCK_ENABLED=true (chỉ dùng cho dev/demo).
    mock-enabled: ${PAYMENTS_MOCK_ENABLED:false}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/orders/vnpay/return}
    frontend-result-url: ${VNPAY_FRONTEND_RESULT_URL:${FRONTEND_URL:http://localhost:5173}/thanh-toan/ket-qua}
    locale: ${VNPAY_LOCALE:vn}
    order-type: ${VNPAY_ORDER_TYPE:other}
    expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}

logging:
  level:
    com.echora.order: INFO
