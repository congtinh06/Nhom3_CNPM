server:
  port: 8081

spring:
  application:
    name: analytics-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=echora_analytics_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:analytics_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:echora_app}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5000ms}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: ${RABBITMQ_TEMPLATE_RETRY_ENABLED:true}
        max-attempts: ${RABBITMQ_TEMPLATE_RETRY_MAX_ATTEMPTS:3}
        initial-interval: ${RABBITMQ_TEMPLATE_RETRY_INITIAL_INTERVAL:1000ms}
        multiplier: ${RABBITMQ_TEMPLATE_RETRY_MULTIPLIER:2.0}
        max-interval: ${RABBITMQ_TEMPLATE_RETRY_MAX_INTERVAL:5000ms}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: ${RABBITMQ_LISTENER_RETRY_ENABLED:true}
          max-attempts: ${RABBITMQ_LISTENER_RETRY_MAX_ATTEMPTS:3}
          initial-interval: ${RABBITMQ_LISTENER_RETRY_INITIAL_INTERVAL:1000ms}
          multiplier: ${RABBITMQ_LISTENER_RETRY_MULTIPLIER:2.0}
          max-interval: ${RABBITMQ_LISTENER_RETRY_MAX_INTERVAL:5000ms}
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:3000}
            read-timeout: ${FEIGN_READ_TIMEOUT:5000}

services:
  content-service:
    url: ${CONTENT_SERVICE_URL:http://localhost:8085}

analytics:
  poi-cache:
    ttl-ms: ${ANALYTICS_POI_CACHE_TTL_MS:300000}
  summary:
    poi-budget-ms: ${ANALYTICS_SUMMARY_POI_BUDGET_MS:3000}
  qr-stats:
    max-range-days: ${ANALYTICS_QR_STATS_MAX_RANGE_DAYS:30}
    poi-budget-ms: ${ANALYTICS_QR_STATS_POI_BUDGET_MS:3000}

# Khoa noi bo de xac thuc request den tu gateway tren endpoint quan tri /api/analytics/summary.
# Rong -> endpoint bi tu choi 403 (fail-closed).
internal:
  api-key: ${INTERNAL_API_KEY:}

feign:
  client:
    config:
      default:
        connectTimeout: ${FEIGN_CONNECT_TIMEOUT:3000}
        readTimeout: ${FEIGN_READ_TIMEOUT:5000}
        retryer: feign.Retryer.NEVER_RETRY
      content-service:
        connectTimeout: ${FEIGN_CONNECT_TIMEOUT:3000}
        readTimeout: ${FEIGN_READ_TIMEOUT:5000}
        retryer: feign.Retryer.NEVER_RETRY

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.echora.analytics: INFO
