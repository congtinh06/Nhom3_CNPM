server:
  port: 8081

spring:
  application:
    name: analytics-service
  datasource:
    # Chuyển sang SQL Server (2026-09): cấu hình PostgreSQL cũ được comment lại (backup)
    # url: ${DB_URL:jdbc:postgresql://localhost:5432/report_db}
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=report_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:Saigon@123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Publisher Confirm (2026-09): broker phải xác nhận (ack) mỗi message;
    # nếu broker sập sau khi lưu DB, callback sẽ ghi log thay vì mất event im lặng
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

services:
  link-verification:
    url: ${LINK_VERIFICATION_SERVICE_URL:http://localhost:8082}

internal:
  api-key: ${INTERNAL_API_KEY:}

logging:
  level:
    com.saigonvoice.analytics: DEBUG
