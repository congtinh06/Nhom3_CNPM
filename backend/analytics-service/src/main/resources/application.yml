server:
  port: 8081

spring:
  application:
    name: analytics-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=echora_analytics_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:analytics_user}
    password: ${DB_PASSWORD:Analytics_Pass!2026}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:echora_app}
    password: ${RABBITMQ_PASSWORD:SgVoice_Rabbit!2026}
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 5s

services:
  content-service:
    url: ${CONTENT_SERVICE_URL:http://localhost:8085}

analytics:
  poi-cache:
    ttl-ms: ${ANALYTICS_POI_CACHE_TTL_MS:300000}
  summary:
    poi-budget-ms: ${ANALYTICS_SUMMARY_POI_BUDGET_MS:3000}
  qr-stats:
    max-range-days: ${ANALYTICS_QR_STATS_MAX_RANGE_DAYS:30}
    poi-budget-ms: ${ANALYTICS_QR_STATS_POI_BUDGET_MS:3000}

# Khoa noi bo de xac thuc request den tu gateway tren endpoint quan tri /api/analytics/summary.
# Rong -> endpoint bi tu choi 403 (fail-closed).
internal:
  api-key: ${INTERNAL_API_KEY:}

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 2000
        retryer: feign.Retryer.NEVER_RETRY
      content-service:
        connectTimeout: 2000
        readTimeout: 2000
        retryer: feign.Retryer.NEVER_RETRY

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.echora.analytics: INFO
