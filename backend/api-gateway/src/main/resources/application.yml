server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - AddRequestHeader=X-Internal-Api-Key,${INTERNAL_API_KEY:}
      routes:
        - id: content-service
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/content/**, /api/poi/**, /api/v1/poi/**
        - id: location-service
          uri: ${LOCATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/location/**, /api/v1/verify/**
        - id: translation-tts-service
          uri: ${TRANSLATION_TTS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/tts/**, /api/translation/**, /api/v1/notifications/**
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/analytics/**, /api/v1/reports/**, /api/v1/stats/**

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.saigonvoice.gateway: DEBUG
