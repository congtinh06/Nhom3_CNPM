server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:15s}
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/auth/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_AUTH_RESPONSE_TIMEOUT_MS:10000}
        - id: auth-service-me-entitlements
          uri: ${AUTH_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/me/entitlements,/api/me/entitlements
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_AUTH_RESPONSE_TIMEOUT_MS:10000}
        - id: content-service
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/content/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_CONTENT_RESPONSE_TIMEOUT_MS:15000}
        - id: content-service-admin-products
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/admin/products/**
        - id: content-service-admin-news
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/admin/news/**
        - id: content-service-product-images
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/img/products/**
        - id: location-service
          uri: ${LOCATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/location/**
        - id: translation-tts-service
          uri: ${TRANSLATION_TTS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/tts/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_AUDIO_RESPONSE_TIMEOUT_MS:60000}
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/analytics/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/orders/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_ORDER_RESPONSE_TIMEOUT_MS:15000}
        - id: order-service-admin
          uri: ${ORDER_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/admin/orders/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_ORDER_RESPONSE_TIMEOUT_MS:15000}
        - id: auth-service-docs
          uri: ${AUTH_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/v3/api-docs/auth,/v3/api-docs/auth-service
          filters:
            - RewritePath=/v3/api-docs/(auth|auth-service), /v3/api-docs
        - id: content-service-docs
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/v3/api-docs/content,/v3/api-docs/content-service
          filters:
            - RewritePath=/v3/api-docs/(content|content-service), /v3/api-docs
        - id: location-service-docs
          uri: ${LOCATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/v3/api-docs/location,/v3/api-docs/location-service
          filters:
            - RewritePath=/v3/api-docs/(location|location-service), /v3/api-docs
        - id: translation-tts-service-docs
          uri: ${TRANSLATION_TTS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/v3/api-docs/translation,/v3/api-docs/translation-tts-service
          filters:
            - RewritePath=/v3/api-docs/(translation|translation-tts-service), /v3/api-docs
        - id: analytics-service-docs
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/v3/api-docs/analytics,/v3/api-docs/analytics-service
          filters:
            - RewritePath=/v3/api-docs/(analytics|analytics-service), /v3/api-docs
        - id: order-service-docs
          uri: ${ORDER_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/v3/api-docs/order,/v3/api-docs/order-service
          filters:
            - RewritePath=/v3/api-docs/(order|order-service), /v3/api-docs

springdoc:
  api-docs:
    enabled: ${ECHORA_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${ECHORA_DOCS_ENABLED:false}
    path: /swagger-ui.html
    urls:
      - name: "Auth Service"
        url: /v3/api-docs/auth-service
      - name: "Content Service"
        url: /v3/api-docs/content-service
      - name: "Location Service"
        url: /v3/api-docs/location-service
      - name: "Translation & TTS Service"
        url: /v3/api-docs/translation-tts-service
      - name: "Analytics Service"
        url: /v3/api-docs/analytics-service
      - name: "Order Service"
        url: /v3/api-docs/order-service

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}
  urls: ${FRONTEND_URLS:}

app:
  jwt:
    secret: ${JWT_SECRET:}

gateway:
  trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}
  rate-limit:
    analytics-per-minute: ${RATE_LIMIT_ANALYTICS_PER_MINUTE:60}

# Khoa noi bo gateway dung de chung thuc voi cac dich vu ha nguon tren cac route admin.
# Rong -> route admin bi tu choi 401 (fail-closed).
internal:
  api-key: ${INTERNAL_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.echora.gateway: DEBUG
  pattern:
    # Gateway la reactive: MDC chi duoc set trong TraceIdGlobalFilter cho dong log
    # cua chinh filter nay; traceId van duoc forward xuong service qua header X-Trace-Id.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:- } --- [%15.15t] [%X{traceId:-}] %-40.40logger{39} : %m%n"
