server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:15s}
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/auth/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_AUTH_RESPONSE_TIMEOUT_MS:10000}
        - id: auth-service-me-entitlements
          uri: ${AUTH_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/me/entitlements,/api/me/entitlements
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_AUTH_RESPONSE_TIMEOUT_MS:10000}
        - id: content-service
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/content/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_CONTENT_RESPONSE_TIMEOUT_MS:15000}
        - id: content-service-admin-products
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/admin/products/**
        - id: content-service-admin-news
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/admin/news/**
        - id: content-service-product-images
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/img/products/**
        - id: location-service
          uri: ${LOCATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/location/**
        - id: translation-tts-service
          uri: ${TRANSLATION_TTS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/tts/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_AUDIO_RESPONSE_TIMEOUT_MS:60000}
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/analytics/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/orders/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_ORDER_RESPONSE_TIMEOUT_MS:15000}
        - id: order-service-admin
          uri: ${ORDER_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/admin/orders/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_ORDER_RESPONSE_TIMEOUT_MS:15000}
        - id: api-docs
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/v3/api-docs/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_CONTENT_RESPONSE_TIMEOUT_MS:15000}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}
  urls: ${FRONTEND_URLS:}

app:
  jwt:
    secret: ${JWT_SECRET:}

gateway:
  trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}
  rate-limit:
    analytics-per-minute: ${RATE_LIMIT_ANALYTICS_PER_MINUTE:60}

# Khoa noi bo gateway dung de chung thuc voi cac dich vu ha nguon tren cac route admin.
# Rong -> route admin bi tu choi 401 (fail-closed).
internal:
  api-key: ${INTERNAL_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.echora.gateway: DEBUG
