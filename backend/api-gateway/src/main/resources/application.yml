server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Fix 401 (2026-09): gateway tu gan internal key cho moi request proxy sang
      # cac service nghiep vu vi InternalApiKeyFilter phia downstream chan request
      # khong key. Client goi TRUC TIEP vao 8082/8083 van bi chan 401 =>
      # defense-in-depth giu nguyen (chi gateway moi vao duoc).
      default-filters:
        - AddRequestHeader=X-Internal-Api-Key,${INTERNAL_API_KEY:}
      routes:
        - id: report-service
          uri: ${REPORT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/reports/**
        - id: link-verification-service
          uri: ${LINK_VERIFICATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/verify/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/notifications/**
        - id: narration-service
          uri: ${NARRATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/narrate/**

frontend:
  url: ${FRONTEND_URL:https://your-app.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.antiphishing.gateway: DEBUG
