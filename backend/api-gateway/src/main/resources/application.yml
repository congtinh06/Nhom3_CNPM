server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/auth/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_AUTH_RESPONSE_TIMEOUT_MS:10000}
        - id: content-service
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/content/**
        - id: content-service-admin-products
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/admin/products/**
        - id: content-service-product-images
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/img/products/**
        - id: location-service
          uri: ${LOCATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/location/**
        - id: translation-tts-service
          uri: ${TRANSLATION_TTS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/tts/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_AUDIO_RESPONSE_TIMEOUT_MS:60000}
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/analytics/**

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}
  urls: ${FRONTEND_URLS:}

app:
  jwt:
    secret: ${JWT_SECRET:}

# Khoa noi bo gateway dung de chung thuc voi cac dich vu ha nguon tren cac route admin.
# Rong -> route admin bi tu choi 401 (fail-closed).
internal:
  api-key: ${INTERNAL_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.saigonvoice.gateway: DEBUG
