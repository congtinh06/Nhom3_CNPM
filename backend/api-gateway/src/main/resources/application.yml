server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: content-service
          uri: ${CONTENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/content/**
        - id: location-service
          uri: ${LOCATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/location/**
        - id: translation-tts-service
          uri: ${TRANSLATION_TTS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/tts/**
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/analytics/**

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.saigonvoice.gateway: DEBUG
