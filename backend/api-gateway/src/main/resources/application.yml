server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: report-service
          uri: ${REPORT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/reports/**
        - id: link-verification-service
          uri: ${LINK_VERIFICATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/verify/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/notifications/**

frontend:
  url: ${FRONTEND_URL:https://your-app.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.antiphishing.gateway: DEBUG
