server:
  port: 8082

spring:
  application:
    name: location-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:3000}
            read-timeout: ${FEIGN_READ_TIMEOUT:5000}

content-service:
  url: ${CONTENT_SERVICE_URL:http://localhost:8085}

internal:
  api-key: ${INTERNAL_API_KEY:}

location:
  max-radius-meters: ${LOCATION_MAX_RADIUS_METERS:5000}

resilience4j:
  circuitbreaker:
    instances:
      locationContentService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          - feign.FeignException$BadRequest
          - feign.FeignException$Unauthorized
          - feign.FeignException$Forbidden
          - feign.FeignException$NotFound
          - feign.FeignException$MethodNotAllowed
          - feign.FeignException$NotAcceptable
          - feign.FeignException$Conflict
          - feign.FeignException$Gone
          - feign.FeignException$UnsupportedMediaType
          - feign.FeignException$TooManyRequests
          - feign.FeignException$UnprocessableEntity
  retry:
    instances:
      locationContentService:
        # Gateway timeout for this route is 15s. One retry gives
        # 2 * 5s read timeout + 200ms backoff = 10.2s worst case.
        max-attempts: 2
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.FeignException$ServiceUnavailable
          - feign.RetryableException

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    com.echora.location: INFO
