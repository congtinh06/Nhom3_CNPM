server:
  port: 8082

spring:
  application:
    name: location-service
  datasource:
    # Chuyển sang SQL Server (2026-09): cấu hình PostgreSQL cũ được comment lại (backup)
    # url: ${DB_URL:jdbc:postgresql://localhost:5432/link_verification_db}
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=link_verification_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:YourStrong!Passw0rd}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # Chuyển sang SQL Server (2026-09): dialect cũ được comment lại (backup)
        # dialect: org.hibernate.dialect.PostgreSQLDialect
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
    open-in-view: false

phishunt:
  base-url: ${PHISHUNT_BASE_URL:https://phishunt.io/api/v1}

google:
  safebrowsing:
    api-key: ${GSB_API_KEY:}
    endpoint: ${GSB_ENDPOINT:https://safebrowsing.googleapis.com/v4/threatMatches:find}

phishtank:
  app-key: ${PHISHTANK_APP_KEY:}
  endpoint: ${PHISHTANK_ENDPOINT:https://checkurl.phishtank.com/checkurl/}

verification:
  mock-mode: ${VERIFICATION_MOCK_MODE:false}
  internal-api-key: ${INTERNAL_API_KEY:}

logging:
  level:
    com.saigonvoice.location: DEBUG
