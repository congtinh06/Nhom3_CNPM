server:
  port: 8083

spring:
  application:
    name: translation-tts-service
  datasource:
    # Chuyển sang SQL Server (2026-09): cấu hình PostgreSQL cũ được comment lại (backup)
    # url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=notification_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:Saigon@123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

notification:
  admin-email: ${ADMIN_EMAIL:admin@anti-phishing-bank.example.com}
  sms:
    enabled: ${SMS_ENABLED:false}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
  to-number-demo: ${TWILIO_TO_NUMBER_DEMO:}

narration:
  service:
    url: ${NARRATION_SERVICE_URL:http://localhost:8084}

internal:
  api-key: ${INTERNAL_API_KEY:}

logging:
  level:
    com.saigonvoice.translation: DEBUG
