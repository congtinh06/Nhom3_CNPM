server:
  port: 8083

spring:
  application:
    name: translation-tts-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        missing-queues-fatal: false
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 5s
app:
  audio:
    storage-dir: ${AUDIO_STORAGE_DIR}
    public-base-url: ${AUDIO_PUBLIC_BASE_URL:}
  translation:
    provider: ${TRANSLATION_PROVIDER:seed}
    mymemory:
      base-url: ${MYMEMORY_BASE_URL:https://api.mymemory.translated.net}
      email: ${MYMEMORY_EMAIL:}
      connect-timeout-ms: ${MYMEMORY_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${MYMEMORY_READ_TIMEOUT_MS:10000}
      # MyMemory official limit: 'q' max 500 bytes (source: https://mymemory.translated.net/doc/spec.php)
      max-chunk-bytes: ${MYMEMORY_MAX_CHUNK_BYTES:450}
    timeout-ms: ${TRANSLATION_TIMEOUT_MS:10000}
  tts:
    timeout-ms: ${TTS_TIMEOUT_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.saigonvoice.translation: INFO
