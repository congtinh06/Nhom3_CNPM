server:
  port: 8083

spring:
  application:
    name: translation-tts-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5000ms}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: ${RABBITMQ_TEMPLATE_RETRY_ENABLED:true}
        max-attempts: ${RABBITMQ_TEMPLATE_RETRY_MAX_ATTEMPTS:3}
        initial-interval: ${RABBITMQ_TEMPLATE_RETRY_INITIAL_INTERVAL:1000ms}
        multiplier: ${RABBITMQ_TEMPLATE_RETRY_MULTIPLIER:2.0}
        max-interval: ${RABBITMQ_TEMPLATE_RETRY_MAX_INTERVAL:5000ms}
    listener:
      simple:
        missing-queues-fatal: false
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: ${RABBITMQ_LISTENER_RETRY_ENABLED:true}
          max-attempts: ${RABBITMQ_LISTENER_RETRY_MAX_ATTEMPTS:3}
          initial-interval: ${RABBITMQ_LISTENER_RETRY_INITIAL_INTERVAL:1000ms}
          multiplier: ${RABBITMQ_LISTENER_RETRY_MULTIPLIER:2.0}
          max-interval: ${RABBITMQ_LISTENER_RETRY_MAX_INTERVAL:5000ms}
internal:
  api-key: ${INTERNAL_API_KEY:}

app:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8086}
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:echora.topic}
    queues:
      poi-created: ${RABBITMQ_QUEUE_POI_CREATED:poi.created.queue}
      poi-updated: ${RABBITMQ_QUEUE_POI_UPDATED:poi.updated.queue}
    routing-keys:
      poi-audio-progress: ${RABBITMQ_ROUTING_KEY_AUDIO_PROGRESS:poi.audio.progress}
      poi-audio-ready: ${RABBITMQ_ROUTING_KEY_AUDIO_READY:poi.audio.ready}
      poi-audio-failed: ${RABBITMQ_ROUTING_KEY_AUDIO_FAILED:poi.audio.failed}
  audio:
    storage-dir: ${AUDIO_STORAGE_DIR}
    public-base-url: ${AUDIO_PUBLIC_BASE_URL:}
  translation:
    provider: ${TRANSLATION_PROVIDER:seed}
    mymemory:
      base-url: ${MYMEMORY_BASE_URL:https://api.mymemory.translated.net}
      email: ${MYMEMORY_EMAIL:}
      connect-timeout-ms: ${MYMEMORY_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${MYMEMORY_READ_TIMEOUT_MS:10000}
      # MyMemory official limit: 'q' max 500 bytes (source: https://mymemory.translated.net/doc/spec.php)
      max-chunk-bytes: ${MYMEMORY_MAX_CHUNK_BYTES:450}
    timeout-ms: ${TRANSLATION_TIMEOUT_MS:10000}
  tts:
    command: ${TTS_COMMAND:edge-tts}
    timeout-ms: ${TTS_TIMEOUT_MS:30000}
    retry:
      # Edge-TTS có thể lỗi mạng tạm thời; thử lại có backoff thay vì đánh FAILED_TTS ngay.
      max-attempts: ${TTS_RETRY_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${TTS_RETRY_INITIAL_BACKOFF_MS:1000}
      multiplier: ${TTS_RETRY_MULTIPLIER:2.0}
      max-backoff-ms: ${TTS_RETRY_MAX_BACKOFF_MS:8000}
    voices:
      vi: ${TTS_VOICE_VI:vi-VN-HoaiMyNeural}
      en: ${TTS_VOICE_EN:en-US-AvaNeural}
      ja: ${TTS_VOICE_JA:ja-JP-NanamiNeural}
      ko: ${TTS_VOICE_KO:ko-KR-SunHiNeural}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.echora.translation: INFO
