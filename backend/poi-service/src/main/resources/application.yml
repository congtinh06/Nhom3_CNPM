server:
  port: 8085

spring:
  application:
    name: poi-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=link_verification_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:YourStrong!Passw0rd}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

overpass:
  url: ${OVERPASS_URL:https://overpass-api.de/api/interpreter}
  timeout-seconds: 15

logging:
  level:
    com.antiphishing.poi: INFO
