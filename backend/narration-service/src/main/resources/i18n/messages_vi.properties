# ======================================================================
# Vietnamese narration templates (locale: vi)
# Key format: reason.<REASON_CODE> = sentence fragment describing the signal
# ======================================================================

narration.opening.high=Trang web này có nguy cơ giả mạo cao vì:
narration.opening.low=Liên kết này có một số dấu hiệu đáng lưu ý sau:
narration.closing=Vui lòng không truy cập liên kết hoặc cung cấp thông tin cá nhân, mã OTP qua địa chỉ này.

reason.DOMAIN_TOO_NEW=tên miền vừa mới được đăng ký gần đây
reason.SSL_INVALID=không có chứng chỉ bảo mật SSL hợp lệ
reason.SSL_EXPIRED=chứng chỉ bảo mật SSL đã hết hạn
reason.BRAND_KEYWORD_MATCH=địa chỉ chứa từ khóa giả danh thương hiệu ngân hàng
reason.BLACKLISTED_DOMAIN=tên miền đã nằm trong danh sách đen (blacklist) về lừa đảo
reason.SUSPICIOUS_REDIRECT=liên kết chuyển hướng người dùng tới một trang đáng ngờ
reason.SHORT_URL_OBFUSCATION=liên kết sử dụng dạng URL rút gọn để che giấu địa chỉ thật
reason.NO_HTTPS=trang web không sử dụng kết nối bảo mật HTTPS
reason.unknown=hệ thống phát hiện một dấu hiệu bất thường chưa xác định ({0})
