# ======================================================================
# English narration templates (locale: en)
# Key format: reason.<REASON_CODE> = sentence fragment describing the signal
# ======================================================================

narration.opening.high=This website shows a high risk of being a phishing attempt because:
narration.opening.low=The following suspicious signals were detected on this link:
narration.closing=Do not visit this link or provide any personal information or one-time passwords (OTP) through it.

reason.DOMAIN_TOO_NEW=the domain was registered very recently
reason.SSL_INVALID=the website does not have a valid SSL certificate
reason.SSL_EXPIRED=the SSL certificate has expired
reason.BRAND_KEYWORD_MATCH=the address contains keywords impersonating a bank brand
reason.BLACKLISTED_DOMAIN=the domain is blacklisted as a phishing site
reason.SUSPICIOUS_REDIRECT=the link redirects users to a suspicious page
reason.SHORT_URL_OBFUSCATION=the link uses a shortened URL to hide the real address
reason.NO_HTTPS=the website does not use a secure HTTPS connection
reason.unknown=an unidentified suspicious signal was detected ({0})
