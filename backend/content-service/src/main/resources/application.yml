server:
  port: 8085

spring:
  application:
    name: content-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=saigonvoice_content_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:YourStrong!Passw0rd}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

overpass:
  url: ${OVERPASS_URL:https://overpass-api.de/api/interpreter}
  timeout-seconds: 15

logging:
  level:
    com.saigonvoice.content: INFO
