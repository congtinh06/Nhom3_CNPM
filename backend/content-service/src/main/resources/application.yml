server:
  port: 8085

spring:
  application:
    name: content-service
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=echora_content_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:content_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:echora_app}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5000ms}
    # Publisher: chờ broker ACK và nhận lại message không route được (PoiEventPublisher kiểm tra cả hai)
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: ${RABBITMQ_TEMPLATE_RETRY_ENABLED:true}
        max-attempts: ${RABBITMQ_TEMPLATE_RETRY_MAX_ATTEMPTS:3}
        initial-interval: ${RABBITMQ_TEMPLATE_RETRY_INITIAL_INTERVAL:1000ms}
        multiplier: ${RABBITMQ_TEMPLATE_RETRY_MULTIPLIER:2.0}
        max-interval: ${RABBITMQ_TEMPLATE_RETRY_MAX_INTERVAL:5000ms}
    listener:
      simple:
        acknowledge-mode: auto
        # Lỗi không bao giờ requeue vô hạn: hết retry -> reject -> x-dead-letter-exchange -> DLQ
        default-requeue-rejected: false
        retry:
          enabled: ${RABBITMQ_LISTENER_RETRY_ENABLED:true}
          max-attempts: ${RABBITMQ_LISTENER_RETRY_MAX_ATTEMPTS:3}
          initial-interval: ${RABBITMQ_LISTENER_RETRY_INITIAL_INTERVAL:1000ms}
          multiplier: ${RABBITMQ_LISTENER_RETRY_MULTIPLIER:2.0}
          max-interval: ${RABBITMQ_LISTENER_RETRY_MAX_INTERVAL:5000ms}

echora:
  messaging:
    confirm-timeout: PT5S
  publish-retry:
    enabled: true
    initial-delay: PT30S
    interval: PT60S
    min-age: PT30S
    max-attempts: 5
  audio:
    # Ngôn ngữ ở trạng thái chờ xử lý lâu hơn ngưỡng này sẽ bị đánh dấu "cần chú ý".
    pending-timeout-minutes: 30
  poi:
    # Biên tọa độ hợp lệ cho POI (mặc định bao trọn TP.HCM).
    bounds:
      min-latitude: ${POI_MIN_LATITUDE:10.30}
      max-latitude: ${POI_MAX_LATITUDE:11.20}
      min-longitude: ${POI_MIN_LONGITUDE:106.30}
      max-longitude: ${POI_MAX_LONGITUDE:107.10}
    trigger-radius:
      max-meters: ${POI_MAX_TRIGGER_RADIUS_METERS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Rỗng = endpoint /api/content/internal/** bị tắt (503), xem InternalApiKeyFilter
internal:
  api-key: ${INTERNAL_API_KEY:}

logging:
  level:
    com.echora.content: INFO

app:
  product:
    upload-dir: ${PRODUCT_UPLOAD_DIR:uploads/products}
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8086}

