server:
  port: 8086

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=echora_auth_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration

internal:
  api-key: ${INTERNAL_API_KEY:}

app:
  jwt:
    # Bắt buộc ở production. Rỗng -> fail-closed: ứng dụng không khởi động được.
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
  refresh:
    ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
    remember-ttl-days: ${REFRESH_REMEMBER_TTL_DAYS:30}
    cookie-name: ${REFRESH_COOKIE_NAME:echora_user_token}
    admin-cookie-name: ${REFRESH_COOKIE_ADMIN_NAME:echora_admin_token}
    cookie-path: /api/auth
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    cookie-samesite: ${REFRESH_COOKIE_SAMESITE:Strict}
  security:
    # Origin được phép gọi các endpoint nhận cookie (chống CSRF)
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    # Danh sách origin bổ sung, phân tách bằng dấu phẩy (vd: tunnel ngrok, domain Vercel).
    frontend-urls: ${FRONTEND_URLS:}
  google:
    # Client ID của Google OAuth (loại Web). Rỗng -> /api/auth/google trả 503.
    # Không đặt client secret ở đây (luồng ID token không cần secret).
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    # Rỗng -> không khởi tạo JavaMailSender, MailService chuyển sang chế độ ghi link ra log (dev/offline)
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:Echora <no-reply@echora.local>}
    start-tls: ${MAIL_STARTTLS:true}
  admin:
    email: ${ADMIN_SEED_EMAIL:quantri@echora.test}
    password: ${ADMIN_SEED_PASSWORD:}
  test-user:
    email: ${SEED_TEST_USER_EMAIL:user@echora.local}
    password: ${SEED_TEST_USER_PASSWORD:}
  demo-premium:
    # Tài khoản demo nghe audio EN/JA/KO; mật khẩu lấy từ .env, không hard-code.
    email: ${DEMO_PREMIUM_EMAIL:}
    password: ${DEMO_PREMIUM_PASSWORD:}
    # Chi seed tai khoản demo Premium khi ECHORA_SEED_DEMO=true (default false: tắt seed).
    seed-enabled: ${ECHORA_SEED_DEMO:false}
  rate-limit:
    login-max-failures: 5
    login-lock: PT15M
    login-ip-max-failures: 20
    login-window: PT15M
    register-per-hour: 10
    forgot-per-hour: 5
  token:
    email-verification-ttl: PT24H
    password-reset-ttl: PT20M
  qr:
    # Thoi gian song cua ma QR dang nhap (ISO-8601). Mac dinh 5 phut de
    # nguoi dung kip quet ma va xac nhan tren thiet bi di dong.
    ttl: ${QR_LOGIN_TTL:PT5M}
    # Tan suat thiet bi A hoi trang thai (ms).
    poll-interval-ms: ${QR_LOGIN_POLL_INTERVAL_MS:1500}
    cleanup-interval-ms: ${QR_LOGIN_CLEANUP_INTERVAL_MS:300000}
    # Thoi gian giu phien QR de phuc vu bao cao admin (ISO-8601). Mac dinh 30 ngay.
    retention: ${QR_LOGIN_RETENTION:P30D}
    stats:
      max-range-days: ${QR_LOGIN_STATS_MAX_RANGE_DAYS:30}

# OpenAPI / Swagger qua API Gateway. ECHORA_DOCS_ENABLED=true (default) -> /v3/api-docs
# va /swagger-ui.html hoat dong; false -> tra ve 404/403 (khong lo noi dung).
springdoc:
  api-docs:
    enabled: ${ECHORA_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${ECHORA_DOCS_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  paths-to-exclude:
    - /internal/**
    - /**/internal/**
  info:
    title: Echora Auth Service
    version: "1.0.0"
    description: "Xac thuc nguoi dung, phan quyen Premium va quan tri tai khoan."
  servers:
    - url: ${GATEWAY_URL:http://localhost:18080}
      description: API Gateway (http://localhost:18080 trong moi truong local)

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.echora.auth: INFO
  pattern:
    # traceId duoc set boi TraceIdFilter tu header X-Trace-Id (gateway truyen xuong).
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:- } --- [%15.15t] [%X{traceId:-}] %-40.40logger{39} : %m%n"
