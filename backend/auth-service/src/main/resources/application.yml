server:
  port: 8086

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=saigonvoice_auth_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:Auth_Pass!2026}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration

app:
  jwt:
    # Bắt buộc ở production. Rỗng -> fail-closed: ứng dụng không khởi động được.
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
  refresh:
    ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
    remember-ttl-days: ${REFRESH_REMEMBER_TTL_DAYS:30}
    cookie-name: ${REFRESH_COOKIE_NAME:refresh_token}
    cookie-path: /api/auth
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    cookie-samesite: ${REFRESH_COOKIE_SAMESITE:Strict}
  security:
    # Origin được phép gọi các endpoint nhận cookie (chống CSRF)
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  google:
    # Client ID của Google OAuth (loại Web). Rỗng -> /api/auth/google trả 503.
    # Không đặt client secret ở đây (luồng ID token không cần secret).
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    # Rỗng -> không khởi tạo JavaMailSender, MailService chuyển sang chế độ ghi link ra log (dev/offline)
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:SaigonVoice <no-reply@saigonvoice.local>}
    start-tls: ${MAIL_STARTTLS:true}
  admin:
    email: ${SEED_ADMIN_EMAIL:admin@saigonvoice.local}
    password: ${SEED_ADMIN_PASSWORD:Admin@123456}
  test-user:
    email: ${SEED_TEST_USER_EMAIL:user@saigonvoice.local}
    password: ${SEED_TEST_USER_PASSWORD:User@123456}
  rate-limit:
    login-max-failures: 5
    login-lock: PT15M
    login-ip-max-failures: 20
    login-window: PT15M
    register-per-hour: 10
    forgot-per-hour: 5
  token:
    email-verification-ttl: PT24H
    password-reset-ttl: PT20M

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.saigonvoice.auth: INFO
