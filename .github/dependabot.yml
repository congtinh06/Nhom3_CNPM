version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /backend/analytics-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: maven
    directory: /backend/api-gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: maven
    directory: /backend/auth-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: maven
    directory: /backend/content-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: maven
    directory: /backend/location-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: maven
    directory: /backend/order-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: maven
    directory: /backend/translation-tts-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
