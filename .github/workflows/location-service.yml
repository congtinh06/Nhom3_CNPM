name: Location Service CI

on:
  push:
    branches: [main, master, 'fix/**', 'feat/**', 'refactor/**']
    paths:
      - 'backend/location-service/**'
      - '.github/workflows/location-service.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/location-service/**'
      - '.github/workflows/location-service.yml'

permissions:
  contents: read

concurrency:
  group: location-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test location-service
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/location-service
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/location-service/pom.xml

      - name: Run tests
        run: mvn -B test

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ github.workflow }}-jacoco
          path: backend/location-service/target/site/jacoco/
          if-no-files-found: ignore

  docker-build:
    name: Build image location-service
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build Docker image (no push)
        run: docker build -t location-service:ci backend/location-service
