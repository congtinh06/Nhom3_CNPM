name: API Gateway Service CI

on:
  push:
    branches: [main, master, 'refactor/**']
    paths:
      - 'backend/api-gateway/**'
      - '.github/workflows/api-gateway.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/api-gateway/**'
      - '.github/workflows/api-gateway.yml'

permissions:
  contents: read

concurrency:
  group: api-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test api-gateway
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/api-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/api-gateway/pom.xml

      - name: Run tests
        run: mvn -B test

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.workflow }}-jacoco
          path: backend/api-gateway/target/site/jacoco/
          if-no-files-found: ignore

  docker-build:
    name: Build image api-gateway
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image (no push)
        run: docker build -t api-gateway:ci backend/api-gateway
