name: Translation TTS Service CI

on:
  push:
    branches: [main, master, 'fix/**', 'feat/**', 'refactor/**']
    paths:
      - 'backend/translation-tts-service/**'
      - '.github/workflows/translation-tts-service.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/translation-tts-service/**'
      - '.github/workflows/translation-tts-service.yml'

permissions:
  contents: read

concurrency:
  group: translation-tts-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test translation-tts-service
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/translation-tts-service
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/translation-tts-service/pom.xml

      - name: Run tests
        run: mvn -B test

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ github.workflow }}-jacoco
          path: backend/translation-tts-service/target/site/jacoco/
          if-no-files-found: ignore

  docker-build:
    name: Build image translation-tts-service
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image (no push)
        run: docker build -t translation-tts-service:ci backend/translation-tts-service
