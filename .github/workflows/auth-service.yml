name: Auth Service CI

on:
  push:
    branches: [main, master, 'fix/**', 'feat/**', 'refactor/**']
    paths:
      - 'backend/auth-service/**'
      - '.github/workflows/auth-service.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/auth-service/**'
      - '.github/workflows/auth-service.yml'

permissions:
  contents: read

concurrency:
  group: auth-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test auth-service
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/auth-service
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/auth-service/pom.xml

      # AuthServiceIntegrationTest dùng Testcontainers MSSQL 2022 (cần Docker trên runner)
      - name: Run tests
        run: mvn -B test

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.workflow }}-jacoco
          path: backend/auth-service/target/site/jacoco/
          if-no-files-found: ignore

  docker-build:
    name: Build image auth-service
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image (no push)
        run: docker build -t auth-service:ci backend/auth-service
