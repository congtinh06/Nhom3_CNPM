name: CD – Build, Push and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

# One CD run per ref. The workflow_run trigger was removed so a push and a
# workflow_run can no longer start two CD runs for the same SHA. cancel-in-progress
# stays false so a new push never kills a deploy that is already running.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  # ── Matrix build: one job per service Dockerfile ────────────────────────────
  build-push:
    needs: [verify-ci]
    # On main, verify-ci must be green before any image is pushed. On a v* tag
    # verify-ci is intentionally skipped (CI runs only on main), so build-push
    # must still run; a cancelled or failed verify-ci never lets it through.
    if: ${{ !cancelled() && (needs.verify-ci.result == 'success' || (startsWith(github.ref, 'refs/tags/v') && needs.verify-ci.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: backend/auth-service
          - service: content-service
            context: backend/content-service
          - service: location-service
            context: backend/location-service
          - service: translation-tts-service
            context: backend/translation-tts-service
          - service: analytics-service
            context: backend/analytics-service
          - service: order-service
            context: backend/order-service
          - service: api-gateway
            context: backend/api-gateway
          - service: frontend
            context: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO}-${{ matrix.service }}"
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha-tag=sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha-tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── Verify every CI workflow that was actually triggered for this SHA ──────
  # Backend CI workflows use path filters, so a workflow with no run for this
  # SHA is not a failure. This job polls the workflow runs of the commit, keeps
  # the latest attempt per workflow, and fails if any completed run is not green.
  # A SHA with no run at all is only treated as docs-only after a grace period,
  # and only if the pushed commits touch no path that any CI workflow watches.
  verify-ci:
    name: Verify CI for this commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (full history for changed-file detection)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Poll CI workflow runs for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          workflows=(
            "Frontend CI"
            "Auth Service CI"
            "Content Service CI"
            "Location Service CI"
            "Translation TTS Service CI"
            "Analytics Service CI"
            "API Gateway Service CI"
            "Order Service CI"
            "Config & Environment Check"
          )
          names_json="$(printf '%s\n' "${workflows[@]}" | jq -R . | jq -s -c .)"

          # Path filters copied from .github/workflows/*.yml. They are only used
          # by the docs-only decision below: if the push touches a path that some
          # CI workflow watches but no run exists for the SHA, the trigger is late
          # or broken, and the deploy must be blocked instead of passing silently.
          # Keep in sync with the paths: blocks of the CI workflows.
          filter_for_file() {
            case "$1" in
              frontend/*|.github/workflows/frontend-ci.yml) echo "Frontend CI" ;;
              backend/auth-service/*|.github/workflows/auth-service.yml) echo "Auth Service CI" ;;
              backend/content-service/*|.github/workflows/content-service.yml) echo "Content Service CI" ;;
              backend/location-service/*|.github/workflows/location-service.yml) echo "Location Service CI" ;;
              backend/translation-tts-service/*|.github/workflows/translation-tts-service.yml) echo "Translation TTS Service CI" ;;
              backend/analytics-service/*|.github/workflows/analytics-service.yml) echo "Analytics Service CI" ;;
              backend/api-gateway/*|.github/workflows/api-gateway.yml) echo "API Gateway Service CI" ;;
              backend/order-service/*|.github/workflows/order-service.yml) echo "Order Service CI" ;;
              .env.example|docker-compose*.yml|scripts/*|.github/workflows/config-check.yml) echo "Config & Environment Check" ;;
            esac
          }

          # Files changed by this push. BASE_SHA is the ref before the push; when
          # it is unusable (new ref, rewritten history) fall back to the tip commit
          # against its first parent, which is the right diff for a merge commit.
          changed_files() {
            local base="${BASE_SHA:-}"
            local zero="0000000000000000000000000000000000000000"
            if [ -n "$base" ] && [ "$base" != "$zero" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git -c core.quotepath=off diff --name-only -z "$base" "$SHA"
            else
              git -c core.quotepath=off show --name-only --pretty=format: --first-parent -z "$SHA"
            fi
          }

          deadline=$((SECONDS + 1500))
          # A run can take a few seconds to appear after the push, so "no run for
          # this SHA" is only accepted as docs-only after this many seconds of
          # uninterrupted zero. Any run seen in between resets the grace period.
          grace_seconds=90
          zero_since=""

          while true; do
            runs="$(gh run list --commit "$SHA" --limit 100 \
              --json workflowName,status,conclusion,databaseId)"
            summary="$(printf '%s' "$runs" | jq -r --argjson names "$names_json" '
              [ .[] | select(.workflowName as $n | $names | index($n)) ]
              | group_by(.workflowName)
              | map(sort_by(.databaseId) | last)
              | [length,
                 ([.[] | select(.status != "completed")] | length),
                 ([.[] | select(.status == "completed" and .conclusion != "success")] | length)]
              | @tsv')"
            IFS=$'\t' read -r total pending failed <<< "$summary"
            echo "CI runs for $SHA: triggered=$total pending=$pending failed=$failed"

            if [ "$failed" -gt 0 ]; then
              printf '%s' "$runs" | jq -r --argjson names "$names_json" '
                [ .[] | select(.workflowName as $n | $names | index($n)) ]
                | group_by(.workflowName)
                | map(sort_by(.databaseId) | last)
                | .[] | select(.status == "completed" and .conclusion != "success")
                | "FAILED: \(.workflowName) (\(.conclusion))"'
              echo "::error::CI failed for $SHA; deploy blocked."
              exit 1
            fi

            if [ "$total" -eq 0 ]; then
              if [ -z "$zero_since" ]; then
                zero_since=$SECONDS
                echo "No CI run found yet for $SHA; waiting ${grace_seconds}s before treating it as docs-only."
              fi
              elapsed_zero=$((SECONDS - zero_since))
              if [ "$elapsed_zero" -ge "$grace_seconds" ]; then
                changed_list="$(mktemp)"
                if ! changed_files > "$changed_list"; then
                  rm -f "$changed_list"
                  echo "::error::Cannot list changed files for $SHA (base: ${BASE_SHA:-none}); refusing to treat it as docs-only."
                  exit 1
                fi

                matches=""
                match_count=0
                while IFS= read -r -d '' file; do
                  [ -n "$file" ] || continue
                  watched="$(filter_for_file "$file")"
                  if [ -n "$watched" ]; then
                    match_count=$((match_count + 1))
                    if [ "$match_count" -le 10 ]; then
                      matches="${matches}${watched}: ${file}"$'\n'
                    fi
                  fi
                done < "$changed_list"
                rm -f "$changed_list"

                if [ "$match_count" -gt 0 ]; then
                  printf '%s' "$matches"
                  if [ "$match_count" -gt 10 ]; then
                    echo "... and $((match_count - 10)) more changed file(s) matching CI path filters"
                  fi
                  echo "::error::No CI run for $SHA after ${elapsed_zero}s, but the push touches CI-monitored paths; refusing to treat it as docs-only."
                  exit 1
                fi

                echo "No path-filtered CI workflow ran for $SHA after ${elapsed_zero}s (docs-only change); nothing to block."
                exit 0
              fi
            else
              if [ -n "$zero_since" ]; then
                echo "CI runs for $SHA appeared after $((SECONDS - zero_since))s; leaving grace period."
              fi
              zero_since=""
            fi

            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "All triggered CI workflows succeeded for $SHA."
              exit 0
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for CI runs of $SHA."
              exit 1
            fi

            sleep 20
          done

  # ── Deploy on the owner's machine through a self-hosted runner ─────────────
  deploy:
    name: Deploy on owner machine (self-hosted)
    needs: [build-push, verify-ci]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, echora]
    timeout-minutes: 40
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    env:
      HEALTH_URL: ${{ secrets.HEALTH_URL }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Sync deploy directory
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_DIR:-}" ]; then
            echo "::error::DEPLOY_DIR is empty. Set the repository variable vars.DEPLOY_DIR to the deploy clone." >&2
            exit 1
          fi
          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "::error::DEPLOY_DIR does not exist: $DEPLOY_DIR" >&2
            exit 1
          fi
          deploy_dir_posix="$(cygpath -u "$DEPLOY_DIR" 2>/dev/null || printf '%s' "$DEPLOY_DIR")"
          if ! git -C "$deploy_dir_posix" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "::error::DEPLOY_DIR is not a git work tree: $DEPLOY_DIR" >&2
            exit 1
          fi
          echo "Fetching origin in deploy clone"
          if ! git -C "$deploy_dir_posix" fetch origin; then
            echo "::error::git fetch origin failed in DEPLOY_DIR." >&2
            exit 1
          fi
          echo "Restoring any local changes before checkout"
          if ! git -C "$deploy_dir_posix" restore --source=HEAD --staged --worktree .; then
            echo "::error::git restore failed in DEPLOY_DIR." >&2
            exit 1
          fi
          echo "Checking out $GITHUB_SHA in deploy clone"
          if ! checkout_output="$(git -C "$deploy_dir_posix" checkout --detach "$GITHUB_SHA" 2>&1)"; then
            printf '%s\n' "$checkout_output" >&2
            echo "::error::git checkout --detach $GITHUB_SHA failed. If the deploy clone has local changes, restore them first; this workflow never runs reset --hard or clean." >&2
            exit 1
          fi
          printf '%s\n' "$checkout_output"

      - name: Deploy via local Docker Compose
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          export IMAGE_TAG="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          export HEALTH_URL="${HEALTH_URL:?Environment secret secrets.HEALTH_URL is required}"
          export DEPLOY_DIR="${DEPLOY_DIR:?Repository variable vars.DEPLOY_DIR is required}"
          # Keep the GHCR token out of the runner's persistent docker config.
          DOCKER_CONFIG_DIR="$(cygpath -u "$RUNNER_TEMP")/docker-config-$GITHUB_RUN_ID"
          mkdir -p "$DOCKER_CONFIG_DIR"
          trap 'rm -rf "$DOCKER_CONFIG_DIR"' EXIT
          export DOCKER_CONFIG="$(cygpath -w "$DOCKER_CONFIG_DIR")"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          bash scripts/deploy/deploy-local.sh

      # Ngrok là tunnel do chủ máy tự bật. Nếu nó trỏ vào Vite dev (5173) mà Vite
      # đã tắt, ngrok trả 502 và smoke test fail dù stack đã deploy xong. Step này
      # tự trỏ tunnel về container frontend (8088) - port luôn sống sau deploy.
      - name: Ensure public tunnel points at the deployed frontend
        if: success()
        shell: powershell
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
          FRONTEND_HOST_PORT: ${{ vars.FRONTEND_HOST_PORT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:HEALTH_URL) {
            throw "secrets.HEALTH_URL is required for the public smoke test."
          }
          $publicHost = ([uri]$env:HEALTH_URL).Host
          $port = 8088
          if ($env:FRONTEND_HOST_PORT -match '^\d+$') {
            $port = [int]$env:FRONTEND_HOST_PORT
          } else {
            $envFile = Join-Path $env:DEPLOY_DIR '.env'
            if (Test-Path $envFile) {
              $line = Select-String -Path $envFile -Pattern '^FRONTEND_HOST_PORT=' | Select-Object -Last 1
              if ($line -and ($line.Line -split '=', 2)[1].Trim() -match '^\d+$') {
                $port = [int](($line.Line -split '=', 2)[1].Trim())
              }
            }
          }
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/deploy/ensure-ngrok-tunnel.ps1') -PublicHost $publicHost -Port $port

      - name: Smoke test public URL
        id: smoke
        if: success()
        shell: bash
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          set -euo pipefail
          temp_dir="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          temp_body="$temp_dir/smoke-body-$GITHUB_RUN_ID.txt"
          trap 'rm -f "$temp_body"' EXIT

          http_code=000
          for attempt in $(seq 1 12); do
            rm -f "$temp_body"
            # Không dùng -f: cần giữ body/thân lỗi để in ra khi fail.
            http_code="$(curl -sS --max-time 10 -H "ngrok-skip-browser-warning: 1" \
              -o "$temp_body" -w '%{http_code}' "$HEALTH_URL" || true)"
            if [ "$http_code" = "200" ] && grep -Eq '"(content|status)"' "$temp_body"; then
              echo "Smoke test OK (HTTP ${http_code})."
              exit 0
            fi
            sleep 5
          done

          last_bytes=0
          if [ -f "$temp_body" ]; then
            last_bytes="$(wc -c < "$temp_body" | tr -d ' ')"
          fi
          echo "::error::Smoke test FAILED after 12 attempts (last HTTP ${http_code}, body ${last_bytes} bytes). Nếu là 502, kiểm tra tunnel ngrok trên máy runner: ngrok phải trỏ vào 127.0.0.1:8088."
          echo "Smoke test FAILED after 12 attempts (last HTTP ${http_code}, body ${last_bytes} bytes)." >&2
          if [ -s "$temp_body" ]; then
            head -c 500 "$temp_body" >&2 || true
            echo >&2
          fi
          exit 1

      - name: Write deploy summary
        if: always()
        shell: bash
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### CD deploy summary"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image tag: \`sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)\`"
            echo "- Smoke test: \`${SMOKE_OUTCOME:-not run}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
          } >> "$GITHUB_STEP_SUMMARY"
