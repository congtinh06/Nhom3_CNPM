name: CD – Build, Push and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

# One CD run per ref. The workflow_run trigger was removed so a push and a
# workflow_run can no longer start two CD runs for the same SHA. cancel-in-progress
# stays false so a new push never kills a deploy that is already running.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  # ── Matrix build: one job per service Dockerfile ────────────────────────────
  build-push:
    needs: [verify-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: backend/auth-service
          - service: content-service
            context: backend/content-service
          - service: location-service
            context: backend/location-service
          - service: translation-tts-service
            context: backend/translation-tts-service
          - service: analytics-service
            context: backend/analytics-service
          - service: order-service
            context: backend/order-service
          - service: api-gateway
            context: backend/api-gateway
          - service: frontend
            context: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO}-${{ matrix.service }}"
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha-tag=sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha-tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── Verify every CI workflow that was actually triggered for this SHA ──────
  # Backend CI workflows use path filters, so a workflow with no run for this
  # SHA is not a failure. This job polls the workflow runs of the commit, keeps
  # the latest attempt per workflow, and fails if any completed run is not green.
  # A SHA with no run at all is only treated as docs-only after a grace period.
  verify-ci:
    name: Verify CI for this commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Poll CI workflow runs for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workflows=(
            "Frontend CI"
            "Auth Service CI"
            "Content Service CI"
            "Location Service CI"
            "Translation TTS Service CI"
            "Analytics Service CI"
            "API Gateway Service CI"
            "Order Service CI"
            "Config & Environment Check"
          )
          names_json="$(printf '%s\n' "${workflows[@]}" | jq -R . | jq -s -c .)"
          deadline=$((SECONDS + 1500))
          # A run can take a few seconds to appear after the push, so "no run for
          # this SHA" is only accepted as docs-only after this many seconds of
          # uninterrupted zero. Any run seen in between resets the grace period.
          grace_seconds=90
          zero_since=""

          while true; do
            runs="$(gh run list --commit "$SHA" --limit 100 \
              --json workflowName,status,conclusion,databaseId)"
            summary="$(printf '%s' "$runs" | jq -r --argjson names "$names_json" '
              [ .[] | select(.workflowName as $n | $names | index($n)) ]
              | group_by(.workflowName)
              | map(sort_by(.databaseId) | last)
              | [length,
                 ([.[] | select(.status != "completed")] | length),
                 ([.[] | select(.status == "completed" and .conclusion != "success")] | length)]
              | @tsv')"
            IFS=$'\t' read -r total pending failed <<< "$summary"
            echo "CI runs for $SHA: triggered=$total pending=$pending failed=$failed"

            if [ "$failed" -gt 0 ]; then
              printf '%s' "$runs" | jq -r --argjson names "$names_json" '
                [ .[] | select(.workflowName as $n | $names | index($n)) ]
                | group_by(.workflowName)
                | map(sort_by(.databaseId) | last)
                | .[] | select(.status == "completed" and .conclusion != "success")
                | "FAILED: \(.workflowName) (\(.conclusion))"'
              echo "::error::CI failed for $SHA; deploy blocked."
              exit 1
            fi

            if [ "$total" -eq 0 ]; then
              if [ -z "$zero_since" ]; then
                zero_since=$SECONDS
                echo "No CI run found yet for $SHA; waiting ${grace_seconds}s before treating it as docs-only."
              fi
              elapsed_zero=$((SECONDS - zero_since))
              if [ "$elapsed_zero" -ge "$grace_seconds" ]; then
                echo "No path-filtered CI workflow ran for $SHA after ${elapsed_zero}s (docs-only change); nothing to block."
                exit 0
              fi
            else
              if [ -n "$zero_since" ]; then
                echo "CI runs for $SHA appeared after $((SECONDS - zero_since))s; leaving grace period."
              fi
              zero_since=""
            fi

            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "All triggered CI workflows succeeded for $SHA."
              exit 0
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for CI runs of $SHA."
              exit 1
            fi

            sleep 20
          done

  # ── Deploy on the owner's machine through a self-hosted runner ─────────────
  deploy:
    name: Deploy on owner machine (self-hosted)
    needs: [build-push, verify-ci]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, echora]
    timeout-minutes: 40
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    env:
      HEALTH_URL: ${{ secrets.HEALTH_URL }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Sync deploy directory
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_DIR:-}" ]; then
            echo "::error::DEPLOY_DIR is empty. Set the repository variable vars.DEPLOY_DIR to the deploy clone." >&2
            exit 1
          fi
          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "::error::DEPLOY_DIR does not exist: $DEPLOY_DIR" >&2
            exit 1
          fi
          deploy_dir_posix="$(cygpath -u "$DEPLOY_DIR" 2>/dev/null || printf '%s' "$DEPLOY_DIR")"
          if ! git -C "$deploy_dir_posix" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "::error::DEPLOY_DIR is not a git work tree: $DEPLOY_DIR" >&2
            exit 1
          fi
          echo "Fetching origin in deploy clone"
          if ! git -C "$deploy_dir_posix" fetch origin; then
            echo "::error::git fetch origin failed in DEPLOY_DIR." >&2
            exit 1
          fi
          echo "Checking out $GITHUB_SHA in deploy clone"
          if ! checkout_output="$(git -C "$deploy_dir_posix" checkout --detach "$GITHUB_SHA" 2>&1)"; then
            printf '%s\n' "$checkout_output" >&2
            echo "::error::git checkout --detach $GITHUB_SHA failed. If the deploy clone has local changes, restore them first; this workflow never runs reset --hard or clean." >&2
            exit 1
          fi
          printf '%s\n' "$checkout_output"

      - name: Deploy via local Docker Compose
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          export IMAGE_TAG="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          export HEALTH_URL="${HEALTH_URL:?Environment secret secrets.HEALTH_URL is required}"
          export DEPLOY_DIR="${DEPLOY_DIR:?Repository variable vars.DEPLOY_DIR is required}"
          # Keep the GHCR token out of the runner's persistent docker config.
          DOCKER_CONFIG_DIR="$(cygpath -u "$RUNNER_TEMP")/docker-config-$GITHUB_RUN_ID"
          mkdir -p "$DOCKER_CONFIG_DIR"
          trap 'rm -rf "$DOCKER_CONFIG_DIR"' EXIT
          export DOCKER_CONFIG="$(cygpath -w "$DOCKER_CONFIG_DIR")"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          bash scripts/deploy/deploy-local.sh

      - name: Smoke test public URL
        id: smoke
        if: success()
        shell: bash
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          set -euo pipefail
          temp_dir="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          temp_body="$temp_dir/smoke-body-$GITHUB_RUN_ID.txt"
          trap 'rm -f "$temp_body"' EXIT

          for attempt in $(seq 1 12); do
            rm -f "$temp_body"
            if curl -fsS --max-time 10 -H "ngrok-skip-browser-warning: 1" -o "$temp_body" "$HEALTH_URL" && grep -q '"content"' "$temp_body"; then
              echo "Smoke test OK."
              exit 0
            fi
            sleep 5
          done

          last_bytes=0
          if [ -f "$temp_body" ]; then
            last_bytes="$(wc -c < "$temp_body" | tr -d ' ')"
          fi
          echo "Smoke test FAILED after 12 attempts (last body size: ${last_bytes} bytes)." >&2
          exit 1

      - name: Write deploy summary
        if: always()
        shell: bash
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### CD deploy summary"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image tag: \`sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)\`"
            echo "- Smoke test: \`${SMOKE_OUTCOME:-not run}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
          } >> "$GITHUB_STEP_SUMMARY"
