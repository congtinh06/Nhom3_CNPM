name: Content Service CI

on:
  push:
    branches: [main, master, 'fix/**', 'feat/**', 'refactor/**']
    paths:
      - 'backend/content-service/**'
      - '.github/workflows/content-service.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/content-service/**'
      - '.github/workflows/content-service.yml'

permissions:
  contents: read

concurrency:
  group: content-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test content-service
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/content-service
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/content-service/pom.xml

      - name: Run tests
        run: mvn -B test

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.workflow }}-jacoco
          path: backend/content-service/target/site/jacoco/
          if-no-files-found: ignore

  docker-build:
    name: Build image content-service
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image (no push)
        run: docker build -t content-service:ci backend/content-service
