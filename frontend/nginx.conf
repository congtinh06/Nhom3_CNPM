# Nginx configuration cho frontend container (Echora)
# Giới hạn kích thước tải lên 3MB (tương thích giới hạn 2MB tệp ảnh + chi phí multipart/form-data)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name localhost;

    # Dung lượng tối đa cho request body
    client_max_body_size 3m;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://accounts.google.com https://*.google.com https://*.googleusercontent.com https://*.gstatic.com https://*.openstreetmap.org https://*.tile.openstreetmap.fr https://*.tile.opentopomap.org https://img.vietqr.io; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://*.gstatic.com; frame-src https://accounts.google.com; frame-ancestors 'none';" always;

    # Phục vụ Single Page Application (SPA) React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Chuyển tiếp các yêu cầu /api/** tới API Gateway
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Gỡ Origin: request đã cùng origin qua proxy nginx, gỡ để CORS filter
        # của gateway không trả 403 khi truy cập qua IP LAN/tên miền khác localhost.
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 3m;
    }

    # Chuyển tiếp các yêu cầu ảnh sản phẩm /img/products/** tới API Gateway
    location /img/products/ {
        proxy_pass http://api-gateway:8080/img/products/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
