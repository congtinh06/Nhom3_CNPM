# Nginx configuration cho frontend container (Echora)
# Giới hạn kích thước tải lên 3MB (tương thích giới hạn 2MB tệp ảnh + chi phí multipart/form-data)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    # nginx-unprivileged chay bang uid 101 nen khong the bind port < 1024
    listen 8080;
    server_name localhost;

    # Dung lượng tối đa cho request body
    client_max_body_size 3m;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://accounts.google.com https://*.google.com https://*.googleusercontent.com https://*.gstatic.com https://*.openstreetmap.org https://*.tile.openstreetmap.fr https://*.tile.opentopomap.org https://img.vietqr.io https://i.ytimg.com https://*.ytimg.com; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://*.gstatic.com; frame-src https://accounts.google.com https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none';" always;

    root /usr/share/nginx/html;
    index index.html;

    # Chỉ các route có thật trong frontend/src/App.tsx mới nhận index.html.
    # Danh sách này phải khớp với vercel.json; chạy `npm run check:spa-routes` để kiểm tra.
    location ~ ^/(van-hoa|culture|kham-pha|explore|diem-du-lich|diem|nearby|thuyet-minh|gan-toi|am-thuc|thuc-uong|am-thuc-thuc-uong|qua-luu-niem|tin-tuc|huong-dan|lien-he|chinh-sach-quyen-rieng-tu|nang-cap|thanh-toan|don-hang|qr|quet-ma|quet-qr-dang-nhap|nhan-dang-nhap|qr-tai-khoan|dat-lai-mat-khau|xac-thuc-email|tai-khoan|quan-tri|dang-nhap|dang-ky|quen-mat-khau)(/|$) {
        try_files $uri $uri/ /index.html;
    }

    # Route không tồn tại trả HTTP 404 thật, kèm trang 404 tĩnh.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Chuyển tiếp các yêu cầu /api/** tới API Gateway
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Gỡ Origin: request đã cùng origin qua proxy nginx, gỡ để CORS filter
        # của gateway không trả 403 khi truy cập qua IP LAN/tên miền khác localhost.
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        # Ghi de (khong noi them) de client khong the tu gui X-Forwarded-For gia.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 3m;
    }

    # Chuyển tiếp các yêu cầu ảnh sản phẩm /img/products/** tới API Gateway
    location /img/products/ {
        proxy_pass http://api-gateway:8080/img/products/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ghi de (khong noi them) de client khong the tu gui X-Forwarded-For gia.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
