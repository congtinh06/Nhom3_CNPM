  <rect x="50" y="350" width="220" height="160" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="50" y="350" width="220" height="28" fill="#f0f0f0" stroke="#000000" stroke-width="1.2"/>
