  <text x="460" y="110" text-anchor="middle" font-size="12" font-weight="bold">2. TÍNH NĂNG CỐT LÕI (FEAT)</text>
  <text x="355" y="135" font-size="10.5">• FEAT-01: Bản đồ GPS Leaflet</text>
