# Overlay dùng cho CD: thay image build tại chỗ bằng image đã publish lên GHCR.
# Luôn chạy kèm `--no-build` để Compose không build lại từ source trên server.
#
#   IMAGE_TAG=sha-abc1234 docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull
#   IMAGE_TAG=sha-abc1234 docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --no-build
services:
  auth-service:
    image: ghcr.io/${GHCR_REPO:-congtinh06/nhom3_cnpm}-auth-service:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      # Production: tắt mọi seed tài khoản (admin / test user / demo premium).
      # Chỉ seed demo Premium khi ECHORA_SEED_DEMO=true; mặc định false.
      ECHORA_SEED_DEMO: "false"
      ADMIN_SEED_EMAIL: ""
      ADMIN_SEED_PASSWORD: ""
      SEED_TEST_USER_EMAIL: ""
      SEED_TEST_USER_PASSWORD: ""
      DEMO_PREMIUM_EMAIL: ""
      DEMO_PREMIUM_PASSWORD: ""
  content-service:
    image: ghcr.io/${GHCR_REPO:-congtinh06/nhom3_cnpm}-content-service:${IMAGE_TAG:?IMAGE_TAG is required}
  location-service:
    image: ghcr.io/${GHCR_REPO:-congtinh06/nhom3_cnpm}-location-service:${IMAGE_TAG:?IMAGE_TAG is required}
  translation-tts-service:
    image: ghcr.io/${GHCR_REPO:-congtinh06/nhom3_cnpm}-translation-tts-service:${IMAGE_TAG:?IMAGE_TAG is required}
  analytics-service:
    image: ghcr.io/${GHCR_REPO:-congtinh06/nhom3_cnpm}-analytics-service:${IMAGE_TAG:?IMAGE_TAG is required}
  order-service:
    image: ghcr.io/${GHCR_REPO:-congtinh06/nhom3_cnpm}-order-service:${IMAGE_TAG:?IMAGE_TAG is required}
  api-gateway:
    image: ghcr.io/${GHCR_REPO:-congtinh06/nhom3_cnpm}-api-gateway:${IMAGE_TAG:?IMAGE_TAG is required}
  frontend:
    image: ghcr.io/${GHCR_REPO:-congtinh06/nhom3_cnpm}-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
